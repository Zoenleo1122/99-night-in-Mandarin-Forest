        .map-container { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; max-width: 400px; margin: 0 auto; }
        .map-btn { background: rgba(0,0,0,0.7); color: white; border: 3px solid #666; padding: 14px; font-size: 15px; border-radius: 10px; cursor: pointer; }
        .map-btn:hover:not(:disabled) { border-color: #4CAF50; background: rgba(76,175,80,0.3); }
        .map-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .map-btn.completed { border-color: #4CAF50; }

        .monster-countdown-title { font-size: 14px; color: #ffcc00; margin-bottom: 5px; }
        .monster-countdown-info { font-size: 16px; color: white; }
        .monster-countdown-prepare { font-size: 12px; color: #ffddaa; margin-top: 8px; }
        .question-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; overflow-y: auto; }
        .question-box { background: rgba(0,0,0,0.85); padding: 20px; border-radius: 15px; max-width: 500px; width: 100%; text-align: center; }
        .question-progress { font-size: 14px; color: #aaa; margin-bottom: 12px; }
        .question-text { font-size: 18px; line-height: 1.6; margin-bottom: 15px; }
        .question-hint { font-size: 13px; color: #88ccff; margin-bottom: 12px; }
        .stage-indicator { background: #333; padding: 6px 12px; border-radius: 20px; font-size: 13px; color: #ffd700; margin-bottom: 12px; display: inline-block; }
        .example-box { background: rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: left; }
        .example-label { color: #88ccff; font-size: 13px; margin-bottom: 5px; }
        .example-text { font-size: 16px; }
        .template-text { font-size: 18px; color: #ffd700; margin-bottom: 15px; }
        .canvas-container { background: white; border-radius: 10px; padding: 8px; margin-bottom: 12px; }
        .writing-canvas { border: 3px solid #4CAF50; border-radius: 8px; background: #fffef0; touch-action: none; }
        .canvas-buttons { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
        .canvas-btn { padding: 10px 20px; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; }
        .clear-btn { background: #666; color: white; }
        .done-btn { background: linear-gradient(180deg, #2196F3, #1565C0); color: white; }
        .multi-canvas-container { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 15px; }
        .single-blank { display: flex; flex-direction: column; align-items: center; }
        .blank-label { font-size: 13px; color: #aaa; margin-bottom: 5px; }
        .blank-canvas-wrap { background: white; border-radius: 8px; padding: 5px; }
        .blank-canvas { border: 2px solid #4CAF50; border-radius: 6px; background: #fffef0; touch-action: none; }
        .answer-reveal { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-top: 12px; }
        .correct-answer { font-size: 28px; margin: 12px 0; color: #4CAF50; }
        .answers-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 15px 0; }
        .answer-item { background: #2E7D32; padding: 8px 15px; border-radius: 8px; font-size: 18px; }
        .confirm-buttons { display: flex; gap: 12px; justify-content: center; margin-top: 12px; }
        .confirm-btn { padding: 12px 25px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; }
        .correct-btn { background: linear-gradient(180deg, #4CAF50, #2E7D32); color: white; }
        .wrong-btn { background: linear-gradient(180deg, #f44336, #c62828); color: white; }
        .answer-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
        .option-btn { background: #333; color: white; border: 2px solid #555; padding: 12px; font-size: 15px; border-radius: 10px; cursor: pointer; }
        .option-btn:hover { border-color: #4CAF50; background: #444; }
        .feedback { margin-top: 12px; font-size: 18px; min-height: 25px; }
        .feedback.correct { color: #4CAF50; }
        .feedback.wrong { color: #f44336; }
        #shop-screen { background-image: url('images/shop.jpg'); }
        .shop-container { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 400px; margin: 0 auto; }
        .shop-item { background: rgba(0,0,0,0.8); padding: 12px 15px; margin: 6px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
        .shop-item-info { display: flex; align-items: center; gap: 8px; font-size: 16px; }
        .shop-item-icon { font-size: 26px; }
        .buy-btn { background: linear-gradient(180deg, #FF9800, #F57C00); color: white; border: none; padding: 8px 16px; font-size: 14px; border-radius: 8px; cursor: pointer; }
        .buy-btn:disabled { background: #666; cursor: not-allowed; }
        .back-btn { background: #555; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 10px; cursor: pointer; margin-top: 15px; }
        .inventory { background: rgba(0,0,0,0.7); padding: 12px; border-radius: 10px; margin-top: 12px; }
        .inventory-title { font-size: 14px; color: #aaa; margin-bottom: 8px; }
        .inventory-items { display: flex; flex-wrap: wrap; gap: 8px; }
        .inv-item { background: #333; padding: 6px 10px; border-radius: 8px; font-size: 14px; }
        .reading-passage { background: rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; margin-bottom: 15px; text-align: left; line-height: 1.7; font-size: 15px; max-height: 150px; overflow-y: auto; }
        #warning-screen { background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .warning-box { background: linear-gradient(180deg, #4a3000, #2a1a00); border: 3px solid #ff9800; padding: 25px; border-radius: 20px; text-align: center; max-width: 380px; width: 95%; }
        .warning-icon { font-size: 50px; margin-bottom: 10px; }
        .warning-title { font-size: 22px; color: #ff9800; margin-bottom: 10px; }
        .warning-monster { font-size: 18px; color: #fff; margin-bottom: 15px; }
        .warning-tip { font-size: 14px; color: #aaa; margin: 15px 0; }
        .warning-requirements { background: rgba(0,0,0,0.5); border: 2px solid #ff9800; border-radius: 10px; padding: 15px; margin: 15px 0; text-align: left; }
        .warning-requirements-title { font-size: 15px; color: #ff9800; margin-bottom: 10px; text-align: center; }
        .warning-requirement-item { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; margin: 8px 0; }
        .warning-requirement-items { font-size: 15px; color: #fff; margin-bottom: 5px; }
        .warning-requirement-desc { font-size: 12px; color: #aaa; }
        .warning-requirement-cost { font-size: 12px; color: #ffd700; margin-top: 3px; }
        .warning-or { text-align: center; color: #888; font-size: 13px; margin: 5px 0; }
        .warning-inventory { background: rgba(0,100,0,0.3); border: 1px solid #4CAF50; border-radius: 8px; padding: 10px; margin-top: 12px; }
        .warning-inventory-title { font-size: 13px; color: #4CAF50; margin-bottom: 5px; }
        .warning-inventory-items { font-size: 14px; color: #fff; }
        .warning-buttons { display: flex; flex-direction: column; gap: 10px; }
        .warning-btn { padding: 14px 25px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; }
        .warning-btn.shop-btn { background: linear-gradient(180deg, #FF9800, #F57C00); color: white; }
        .warning-btn.fight-btn { background: linear-gradient(180deg, #aa0000, #660000); color: white; }
        #monster-screen { background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .monster-box { background: rgba(50,0,0,0.9); border: 3px solid #aa0000; padding: 30px; border-radius: 20px; text-align: center; max-width: 350px; }
        .monster-icon { font-size: 70px; margin-bottom: 15px; }
        .monster-name { font-size: 24px; color: #ff6666; margin-bottom: 12px; }
        .monster-desc { font-size: 14px; color: #ccc; margin-bottom: 15px; }
        .monster-actions { display: flex; flex-direction: column; gap: 8px; }
        .monster-btn { background: linear-gradient(180deg, #aa0000, #660000); color: white; border: none; padding: 12px; font-size: 16px; border-radius: 10px; cursor: pointer; }
        .monster-btn:disabled { background: #444; cursor: not-allowed; }
        #gameover-screen, #victory-screen { background: rgba(0,0,0,0.95); justify-content: center; align-items: center; text-align: center; }
        .gameover-box { padding: 30px; }
        .gameover-title { font-size: 32px; color: #f44336; margin-bottom: 15px; }
        .gameover-reason { font-size: 18px; color: #ccc; margin-bottom: 25px; }
        .victory-title { font-size: 32px; color: #4CAF50; margin-bottom: 15px; }

<body>
    <div id="menu-screen" class="screen active">
        <h1 class="game-title">🌲 森林生存國語挑戰 🌲</h1>
        <button class="menu-btn" onclick="startGame()">開始遊戲</button>
    </div>

    <div id="map-screen" class="screen">
        <div class="status-bar">
            <span class="status-item">💎 <span id="gems-display">0</span></span>
            <span class="status-item">🍙 <span id="food-display">0</span></span>
        </div>
        <div class="inventory">
            <div class="inventory-title">🎒 背包</div>
            <div class="inventory-items" id="inventory-display"></div>
        </div>
        <div id="monster-countdown-container"></div>
        <div class="map-container">
            <button class="map-btn" id="map-cabin" onclick="enterMap('cabin')">🏚️ 字林小屋（生字填空）</button>
            <button class="map-btn" id="map-swamp" onclick="enterMap('swamp')">🐸 錯字沼澤（改錯字）</button>
            <button class="map-btn" id="map-temple" onclick="enterMap('temple')">🏛️ 部首神殿（筆畫·部首·造詞）</button>
            <button class="map-btn" id="map-sound" onclick="enterMap('sound')">🎵 讀音森林（不同讀音）</button>
            <button class="map-btn" id="map-sentence" onclick="enterMap('sentence')">✏️ 造句山谷（照樣造句）</button>
            <button class="map-btn" id="map-maze" onclick="enterMap('maze')">🌙 閱讀迷宮（閱讀測驗）</button>
            <button class="map-btn" onclick="openShop()">🛒 商店</button>
        </div>
    </div>

    <div id="question-screen" class="screen">
        <div class="status-bar">
            <span class="status-item">💎 <span id="gems-display2">0</span></span>
            <span class="status-item">🍙 <span id="food-display2">0</span></span>
        </div>
        <div class="question-container">
            <div class="question-box">
                <div class="question-progress" id="progress-display"></div>
                <div id="stage-display"></div>
                <div id="reading-passage-container"></div>
                <div id="example-container"></div>
                <div class="question-text" id="question-text"></div>
                <div class="question-hint" id="question-hint"></div>
                <div id="answer-area"></div>
                <div class="feedback" id="feedback"></div>
            </div>
        </div>
    </div>

    <div id="shop-screen" class="screen">
        <div class="status-bar">
            <span class="status-item">💎 <span id="gems-display3">0</span></span>
            <span class="status-item">🍙 <span id="food-display3">0</span></span>
        </div>
        <div class="inventory">
            <div class="inventory-title">🎒 背包</div>
            <div class="inventory-items" id="inventory-display2"></div>
        </div>
        <div class="shop-container">
            <div class="shop-item"><div class="shop-item-info"><span class="shop-item-icon">🍙</span> 食物</div><button class="buy-btn" onclick="buyItem('food')">3💎</button></div>
            <div class="shop-item"><div class="shop-item-info"><span class="shop-item-icon">🔥</span> 火把</div><button class="buy-btn" onclick="buyItem('torch')">4💎</button></div>
            <div class="shop-item"><div class="shop-item-info"><span class="shop-item-icon">🐰</span> 兔子角</div><button class="buy-btn" onclick="buyItem('rabbitHorn')">4💎</button></div>
            <div class="shop-item"><div class="shop-item-info"><span class="shop-item-icon">🗡️</span> 苦無</div><button class="buy-btn" onclick="buyItem('kunai')">10💎</button></div>
            <div class="shop-item"><div class="shop-item-info"><span class="shop-item-icon">🧵</span> 合成毛皮</div><button class="buy-btn" onclick="craftFur()">低等×2</button></div>
            <button class="back-btn" id="shop-back-btn" onclick="closeShop()">返回地圖</button>
        </div>
    </div>

    <div id="warning-screen" class="screen">
        <div class="warning-box">
            <div class="warning-icon">⚠️</div>
            <div class="warning-title" id="warning-title">夜晚即將來臨！</div>
            <div class="warning-monster" id="warning-monster">🐺 Wolf</div>
            <div class="warning-requirements" id="warning-requirements"></div>
            <div class="warning-tip">請做好準備！</div>
            <div class="warning-buttons">
                <button class="warning-btn shop-btn" onclick="goToShopFromWarning()">🛒 進入商店準備</button>
                <button class="warning-btn fight-btn" onclick="proceedToMonster()">⚔️ 直接面對</button>
            </div>
        </div>
    </div>

    <div id="monster-screen" class="screen">
        <div class="monster-box">
            <div class="monster-icon" id="monster-icon">🐺</div>
            <div class="monster-name" id="monster-name">Wolf</div>
            <div class="monster-desc" id="monster-desc"></div>
            <div class="monster-actions" id="monster-actions"></div>
        </div>
    </div>

    <div id="gameover-screen" class="screen">
        <div class="gameover-box">
            <h1 class="gameover-title">💀 遊戲結束</h1>
            <p class="gameover-reason" id="gameover-reason"></p>
            <button class="menu-btn" onclick="location.reload()">重新開始</button>
        </div>
    </div>

    <div id="victory-screen" class="screen">
        <div class="gameover-box">
            <h1 class="victory-title">🎉 恭喜過關！</h1>
            <p style="font-size:18px;margin-bottom:25px;">你成功在森林中生存下來！</p>
            <p style="font-size:16px;color:#aaa;" id="final-stats"></p>
            <button class="menu-btn" onclick="location.reload()">再玩一次</button>
        </div>
    </div>

        .inventory { background: rgba(0,0,0,0.7); padding: 12px; border-radius: 10px; margin-top: 12px; }
        .inventory-title { font-size: 14px; color: #aaa; margin-bottom: 8px; }
        .inventory-items { display: flex; flex-wrap: wrap; gap: 8px; }
        .inv-item { background: #333; padding: 6px 10px; border-radius: 8px; font-size: 14px; }
        .reading-passage { background: rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; margin-bottom: 15px; text-align: left; line-height: 1.7; font-size: 15px; max-height: 150px; overflow-y: auto; }
        #warning-screen { background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .warning-box { background: linear-gradient(180deg, #4a3000, #2a1a00); border: 3px solid #ff9800; padding: 25px; border-radius: 20px; text-align: center; max-width: 380px; width: 95%; }
        .warning-icon { font-size: 50px; margin-bottom: 10px; }
        .warning-title { font-size: 22px; color: #ff9800; margin-bottom: 10px; }
        .warning-monster { font-size: 18px; color: #fff; margin-bottom: 15px; }
        .warning-tip { font-size: 14px; color: #aaa; margin: 15px 0; }
        .warning-requirements { background: rgba(0,0,0,0.5); border: 2px solid #ff9800; border-radius: 10px; padding: 15px; margin: 15px 0; text-align: left; }
        .warning-requirements-title { font-size: 15px; color: #ff9800; margin-bottom: 10px; text-align: center; }
        .warning-requirement-item { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; margin: 8px 0; }
        .warning-requirement-items { font-size: 15px; color: #fff; margin-bottom: 5px; }
        .warning-requirement-desc { font-size: 12px; color: #aaa; }
        .warning-requirement-cost { font-size: 12px; color: #ffd700; margin-top: 3px; }
        .warning-or { text-align: center; color: #888; font-size: 13px; margin: 5px 0; }
        .warning-inventory { background: rgba(0,100,0,0.3); border: 1px solid #4CAF50; border-radius: 8px; padding: 10px; margin-top: 12px; }
        .warning-inventory-title { font-size: 13px; color: #4CAF50; margin-bottom: 5px; }
        .warning-inventory-items { font-size: 14px; color: #fff; }
        .warning-buttons { display: flex; flex-direction: column; gap: 10px; }
        .warning-btn { padding: 14px 25px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; }
        .warning-btn.shop-btn { background: linear-gradient(180deg, #FF9800, #F57C00); color: white; }
        .warning-btn.fight-btn { background: linear-gradient(180deg, #aa0000, #660000); color: white; }
        #monster-screen { background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
        .monster-box { background: rgba(50,0,0,0.9); border: 3px solid #aa0000; padding: 30px; border-radius: 20px; text-align: center; max-width: 350px; }
        .monster-icon { font-size: 70px; margin-bottom: 15px; }
        .monster-name { font-size: 24px; color: #ff6666; margin-bottom: 12px; }
        .monster-desc { font-size: 14px; color: #ccc; margin-bottom: 15px; }
        .monster-actions { display: flex; flex-direction: column; gap: 8px; }
        .monster-btn { background: linear-gradient(180deg, #aa0000, #660000); color: white; border: none; padding: 12px; font-size: 16px; border-radius: 10px; cursor: pointer; }
        .monster-btn:disabled { background: #444; cursor: not-allowed; }
        #gameover-screen, #victory-screen { background: rgba(0,0,0,0.95); justify-content: center; align-items: center; text-align: center; }
        .gameover-box { padding: 30px; }
        .gameover-title { font-size: 32px; color: #f44336; margin-bottom: 15px; }
        .gameover-reason { font-size: 18px; color: #ccc; margin-bottom: 25px; }
        .victory-title { font-size: 32px; color: #4CAF50; margin-bottom: 15px; }

</head>
<body>
    <div id="menu-screen" class="screen active">
        <h1 class="game-title">🌲 森林生存國語挑戰 🌲</h1>
        <button class="menu-btn" onclick="startGame()">開始遊戲</button>
    </div>

    <div id="map-screen" class="screen">
        <div class="status-bar">
            <span class="status-item">💎 <span id="gems-display">0</span></span>
            <span class="status-item">🍙 <span id="food-display">0</span></span>
        </div>
        <div class="inventory">
            <div class="inventory-title">🎒 背包</div>
            <div class="inventory-items" id="inventory-display"></div>
        </div>
        <div id="monster-countdown-container"></div>
        <div class="map-container">
            <button class="map-btn" id="map-cabin" onclick="enterMap('cabin')">🏚️ 字林小屋（生字填空）</button>
            <button class="map-btn" id="map-swamp" onclick="enterMap('swamp')">🐸 錯字沼澤（改錯字）</button>
            <button class="map-btn" id="map-temple" onclick="enterMap('temple')">🏛️ 部首神殿（筆畫·部首·造詞）</button>
            <button class="map-btn" id="map-sound" onclick="enterMap('sound')">🎵 讀音森林（不同讀音）</button>
            <button class="map-btn" id="map-sentence" onclick="enterMap('sentence')">✏️ 造句山谷（照樣造句）</button>
            <button class="map-btn" id="map-maze" onclick="enterMap('maze')">🌙 閱讀迷宮（閱讀測驗）</button>
            <button class="map-btn" onclick="openShop()">🛒 商店</button>
        </div>
    </div>

    <div id="question-screen" class="screen">
        <div class="status-bar">
            <span class="status-item">💎 <span id="gems-display2">0</span></span>
            <span class="status-item">🍙 <span id="food-display2">0</span></span>
        </div>
        <div class="question-container">
            <div class="question-box">
                <div class="question-progress" id="progress-display"></div>
                <div id="stage-display"></div>
                <div id="reading-passage-container"></div>
                <div id="example-container"></div>
                <div class="question-text" id="question-text"></div>
                <div class="question-hint" id="question-hint"></div>
                <div id="answer-area"></div>
                <div class="feedback" id="feedback"></div>
            </div>
        </div>
    </div>

    <div id="shop-screen" class="screen">
        <div class="status-bar">
            <span class="status-item">💎 <span id="gems-display3">0</span></span>
            <span class="status-item">🍙 <span id="food-display3">0</span></span>
        </div>
        <div class="inventory">
            <div class="inventory-title">🎒 背包</div>
            <div class="inventory-items" id="inventory-display2"></div>
        </div>
        <div class="shop-container">
            <div class="shop-item"><div class="shop-item-info"><span class="shop-item-icon">🍙</span> 食物</div><button class="buy-btn" onclick="buyItem('food')">3💎</button></div>
            <div class="shop-item"><div class="shop-item-info"><span class="shop-item-icon">🔥</span> 火把</div><button class="buy-btn" onclick="buyItem('torch')">4💎</button></div>
            <div class="shop-item"><div class="shop-item-info"><span class="shop-item-icon">🐰</span> 兔子角</div><button class="buy-btn" onclick="buyItem('rabbitHorn')">4💎</button></div>
            <div class="shop-item"><div class="shop-item-info"><span class="shop-item-icon">🗡️</span> 苦無</div><button class="buy-btn" onclick="buyItem('kunai')">10💎</button></div>
            <div class="shop-item"><div class="shop-item-info"><span class="shop-item-icon">🧵</span> 合成毛皮</div><button class="buy-btn" onclick="craftFur()">低等×2</button></div>
            <button class="back-btn" id="shop-back-btn" onclick="closeShop()">返回地圖</button>
        </div>
    </div>

    <div id="warning-screen" class="screen">
        <div class="warning-box">
            <div class="warning-icon">⚠️</div>
            <div class="warning-title" id="warning-title">夜晚即將來臨！</div>
            <div class="warning-monster" id="warning-monster">🐺 Wolf</div>
            <div class="warning-requirements" id="warning-requirements"></div>
            <div class="warning-tip">請做好準備！</div>
            <div class="warning-buttons">
                <button class="warning-btn shop-btn" onclick="goToShopFromWarning()">🛒 進入商店準備</button>
                <button class="warning-btn fight-btn" onclick="proceedToMonster()">⚔️ 直接面對</button>
            </div>
        </div>
    </div>

    <div id="monster-screen" class="screen">
        <div class="monster-box">
            <div class="monster-icon" id="monster-icon">🐺</div>
            <div class="monster-name" id="monster-name">Wolf</div>
            <div class="monster-desc" id="monster-desc"></div>
            <div class="monster-actions" id="monster-actions"></div>
        </div>
    </div>

    <div id="gameover-screen" class="screen">
        <div class="gameover-box">
            <h1 class="gameover-title">💀 遊戲結束</h1>
            <p class="gameover-reason" id="gameover-reason"></p>
            <button class="menu-btn" onclick="location.reload()">重新開始</button>
        </div>
    </div>

    <div id="victory-screen" class="screen">
        <div class="gameover-box">
            <h1 class="victory-title">🎉 恭喜過關！</h1>
            <p style="font-size:18px;margin-bottom:25px;">你成功在森林中生存下來！</p>
            <p style="font-size:16px;color:#aaa;" id="final-stats"></p>
            <button class="menu-btn" onclick="location.reload()">再玩一次</button>
        </div>
    </div>
