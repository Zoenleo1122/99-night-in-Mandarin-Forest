<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>森林生存國語挑戰</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            color: white;
            overflow-x: hidden;
        }

        .screen {
            display: none;
            min-height: 100vh;
            background-size: cover;
            background-position: center;
            padding: 20px;
        }

        .screen.active {
            display: flex;
            flex-direction: column;
        }

        .status-bar {
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 20px;
        }

        .status-item {
            font-size: 18px;
        }

        #menu-screen {
            background-image: url('images/menu.jpg');
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .game-title {
            font-size: 28px;
            text-shadow: 3px 3px 6px black;
            margin-bottom: 40px;
            background: rgba(0,0,0,0.6);
            padding: 20px 30px;
            border-radius: 15px;
        }

        .menu-btn {
            background: linear-gradient(180deg, #4CAF50, #2E7D32);
            color: white;
            border: none;
            padding: 20px 60px;
            font-size: 24px;
            border-radius: 15px;
            cursor: pointer;
            margin: 10px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }

        .menu-btn:hover {
            transform: scale(1.05);
        }

        #map-screen {
            background-image: url('images/menu.jpg');
        }

        .map-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 12px;
            max-width: 400px;
            margin: 0 auto;
        }

        .map-btn {
            background: rgba(0,0,0,0.7);
            color: white;
            border: 3px solid #666;
            padding: 15px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .map-btn:hover:not(:disabled) {
            border-color: #4CAF50;
            background: rgba(76,175,80,0.3);
        }

        .map-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .map-btn.completed {
            border-color: #4CAF50;
        }

        #question-screen {
            background-size: cover;
            background-position: center;
        }

        .question-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .question-box {
            background: rgba(0,0,0,0.85);
            padding: 25px;
            border-radius: 15px;
            max-width: 500px;
            width: 100%;
            text-align: center;
        }

        .question-progress {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 15px;
        }

        .question-text {
            font-size: 20px;
            line-height: 1.6;
            margin-bottom: 20px;
        }

        .question-hint {
            font-size: 14px;
            color: #88ccff;
            margin-bottom: 15px;
        }

        .canvas-container {
            background: white;
            border-radius: 10px;
            padding: 10px;
            margin-bottom: 15px;
        }

        #writing-canvas {
            border: 3px solid #4CAF50;
            border-radius: 8px;
            background: #fffef0;
            touch-action: none;
        }

        .canvas-buttons {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-bottom: 15px;
        }

        .canvas-btn {
            padding: 12px 25px;
            font-size: 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        .clear-btn {
            background: #666;
            color: white;
        }

        .done-btn {
            background: linear-gradient(180deg, #2196F3, #1565C0);
            color: white;
        }

        .answer-reveal {
            background: rgba(255,255,255,0.1);
            padding: 20px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .correct-answer {
            font-size: 36px;
            margin: 15px 0;
            color: #4CAF50;
        }

        .confirm-buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 15px;
        }

        .confirm-btn {
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        .correct-btn {
            background: linear-gradient(180deg, #4CAF50, #2E7D32);
            color: white;
        }

        .wrong-btn {
            background: linear-gradient(180deg, #f44336, #c62828);
            color: white;
        }

        .answer-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }

        .option-btn {
            background: #333;
            color: white;
            border: 2px solid #555;
            padding: 15px;
            font-size: 16px;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .option-btn:hover {
            border-color: #4CAF50;
            background: #444;
        }

        .feedback {
            margin-top: 15px;
            font-size: 20px;
            min-height: 30px;
        }

        .feedback.correct {
            color: #4CAF50;
        }

        .feedback.wrong {
            color: #f44336;
        }

        #shop-screen {
            background-image: url('images/shop.jpg');
        }

        .shop-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            max-width: 400px;
            margin: 0 auto;
        }

        .shop-item {
            background: rgba(0,0,0,0.8);
            padding: 15px 20px;
            margin: 8px 0;
            border-radius: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .shop-item-info {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 18px;
        }

        .shop-item-icon {
            font-size: 30px;
        }

        .buy-btn {
            background: linear-gradient(180deg, #FF9800, #F57C00);
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
        }

        .buy-btn:disabled {
            background: #666;
            cursor: not-allowed;
        }

        .back-btn {
            background: #555;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
            margin-top: 20px;
        }

        .inventory {
            background: rgba(0,0,0,0.7);
            padding: 15px;
            border-radius: 10px;
            margin-top: 15px;
        }

        .inventory-title {
            font-size: 16px;
            color: #aaa;
            margin-bottom: 10px;
        }

        .inventory-items {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .inv-item {
            background: #333;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 16px;
        }

        #monster-screen {
            background: rgba(0,0,0,0.9);
            justify-content: center;
            align-items: center;
        }

        .monster-box {
            background: rgba(50,0,0,0.9);
            border: 3px solid #aa0000;
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
        }

        .monster-icon {
            font-size: 80px;
            margin-bottom: 20px;
        }

        .monster-name {
            font-size: 28px;
            color: #ff6666;
            margin-bottom: 15px;
        }

        .monster-desc {
            font-size: 16px;
            color: #ccc;
            margin-bottom: 20px;
        }

        .monster-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .monster-btn {
            background: linear-gradient(180deg, #aa0000, #660000);
            color: white;
            border: none;
            padding: 15px;
            font-size: 18px;
            border-radius: 10px;
            cursor: pointer;
        }

        .monster-btn:disabled {
            background: #444;
            cursor: not-allowed;
        }

        .reading-passage {
            background: rgba(255,255,255,0.1);
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: left;
            line-height: 1.8;
            font-size: 16px;
            max-height: 180px;
            overflow-y: auto;
        }

        #gameover-screen {
            background: rgba(0,0,0,0.95);
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .gameover-box {
            padding: 40px;
        }

        .gameover-title {
            font-size: 36px;
            color: #f44336;
            margin-bottom: 20px;
        }

        .gameover-reason {
            font-size: 20px;
            color: #ccc;
            margin-bottom: 30px;
        }

        .victory-title {
            font-size: 36px;
            color: #4CAF50;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <!-- 主選單 -->
    <div id="menu-screen" class="screen active">
        <h1 class="game-title">🌲 森林生存國語挑戰 🌲</h1>
        <button class="menu-btn" onclick="startGame()">開始遊戲</button>
    </div>

    <!-- 地圖選擇 -->
    <div id="map-screen" class="screen">
        <div class="status-bar">
            <span class="status-item">💎 寶石：<span id="gems-display">0</span></span>
            <span class="status-item">🍙 食物：<span id="food-display">0</span></span>
        </div>
        <div class="inventory">
            <div class="inventory-title">🎒 背包</div>
            <div class="inventory-items" id="inventory-display"></div>
        </div>
        <div class="map-container">
            <button class="map-btn" id="map-cabin" onclick="enterMap('cabin')">🏚️ 字林小屋（生字填空）</button>
            <button class="map-btn" id="map-swamp" onclick="enterMap('swamp')">🐸 錯字沼澤（改錯字）</button>
            <button class="map-btn" id="map-temple" onclick="enterMap('temple')">🏛️ 部首神殿（部首筆畫造詞）</button>
            <button class="map-btn" id="map-sound" onclick="enterMap('sound')">🎵 讀音森林（不同讀音）</button>
            <button class="map-btn" id="map-sentence" onclick="enterMap('sentence')">✏️ 造句山谷（照樣造句）</button>
            <button class="map-btn" id="map-maze" onclick="enterMap('maze')">🌙 閱讀迷宮（閱讀測驗）</button>
            <button class="map-btn" onclick="openShop()">🛒 商店</button>
        </div>
    </div>

    <!-- 題目畫面 -->
    <div id="question-screen" class="screen">
        <div class="status-bar">
            <span class="status-item">💎 寶石：<span id="gems-display2">0</span></span>
            <span class="status-item">🍙 食物：<span id="food-display2">0</span></span>
        </div>
        <div class="question-container">
            <div class="question-box">
                <div class="question-progress" id="progress-display"></div>
                <div id="reading-passage-container"></div>
                <div class="question-text" id="question-text"></div>
                <div class="question-hint" id="question-hint"></div>
                <div id="answer-area"></div>
                <div class="feedback" id="feedback"></div>
            </div>
        </div>
    </div>

    <!-- 商店 -->
    <div id="shop-screen" class="screen">
        <div class="status-bar">
            <span class="status-item">💎 寶石：<span id="gems-display3">0</span></span>
            <span class="status-item">🍙 食物：<span id="food-display3">0</span></span>
        </div>
        <div class="inventory">
            <div class="inventory-title">🎒 背包</div>
            <div class="inventory-items" id="inventory-display2"></div>
        </div>
        <div class="shop-container">
            <div class="shop-item">
                <div class="shop-item-info"><span class="shop-item-icon">🍙</span> 食物</div>
                <button class="buy-btn" onclick="buyItem('food')">3 💎</button>
            </div>
            <div class="shop-item">
                <div class="shop-item-info"><span class="shop-item-icon">🔥</span> 火把</div>
                <button class="buy-btn" onclick="buyItem('torch')">4 💎</button>
            </div>
            <div class="shop-item">
                <div class="shop-item-info"><span class="shop-item-icon">🐰</span> 兔子角</div>
                <button class="buy-btn" onclick="buyItem('rabbitHorn')">4 💎</button>
            </div>
            <div class="shop-item">
                <div class="shop-item-info"><span class="shop-item-icon">🗡️</span> 苦無</div>
                <button class="buy-btn" onclick="buyItem('kunai')">10 💎</button>
            </div>
            <div class="shop-item">
                <div class="shop-item-info"><span class="shop-item-icon">🧵</span> 合成毛皮（低等毛皮 ×2）</div>
                <button class="buy-btn" onclick="craftFur()">合成</button>
            </div>
            <button class="back-btn" onclick="closeShop()">返回地圖</button>
        </div>
    </div>

    <!-- 怪物事件 -->
    <div id="monster-screen" class="screen">
        <div class="monster-box">
            <div class="monster-icon" id="monster-icon">🐺</div>
            <div class="monster-name" id="monster-name">Wolf</div>
            <div class="monster-desc" id="monster-desc"></div>
            <div class="monster-actions" id="monster-actions"></div>
        </div>
    </div>

    <!-- 遊戲結束 -->
    <div id="gameover-screen" class="screen">
        <div class="gameover-box">
            <h1 class="gameover-title">💀 遊戲結束</h1>
            <p class="gameover-reason" id="gameover-reason"></p>
            <button class="menu-btn" onclick="location.reload()">重新開始</button>
        </div>
    </div>

    <!-- 勝利畫面 -->
    <div id="victory-screen" class="screen">
        <div class="gameover-box">
            <h1 class="victory-title">🎉 恭喜過關！</h1>
            <p style="font-size: 20px; margin-bottom: 30px;">你成功在森林中生存下來！</p>
            <p style="font-size: 18px; color: #aaa;" id="final-stats"></p>
            <button class="menu-btn" onclick="location.reload()">再玩一次</button>
        </div>
    </div>

    <script>
        // ==================== 題庫 ====================
        
        const questions = {
            // 一、生字填空（20題，每題1分）
            cabin: [
                { q: "（ㄎㄜˋ）家文化園區", a: "客" },
                { q: "（ㄊㄧˇ）驗活動", a: "體" },
                { q: "最有（ㄑㄩˋ）", a: "趣" },
                { q: "（ㄖㄜˋ）呼呼的開水", a: "熱" },
                { q: "（ㄔㄨㄥ）泡擂茶", a: "沖" },
                { q: "老師教我唱好幾（ㄕㄡˇ）歌", a: "首" },
                { q: "慶祝聖誕（ㄐㄧㄝˊ）", a: "節" },
                { q: "他在學校跌（ㄉㄠˇ）了", a: "倒" },
                { q: "護理師（ㄍㄢˇ）緊通知家人", a: "趕" },
                { q: "大家（ㄑㄧㄤˇ）著吃蝦仁蒸蛋", a: "搶" },
                { q: "（ㄒㄧㄚ）仁蒸蛋", a: "蝦" },
                { q: "新聞主（ㄅㄛˋ）", a: "播" },
                { q: "（ㄅㄠˋ）導警察抓到小偷", a: "報" },
                { q: "（ㄔㄨㄤˇ）空門的小偷", a: "闖" },
                { q: "精采的鼓（ㄓㄤˇ）", a: "掌" },
                { q: "（ㄅㄛˊ）子上戴項鍊", a: "脖" },
                { q: "一條（ㄒㄧㄤˋ）鍊", a: "項" },
                { q: "猜燈（ㄇㄧˊ）活動", a: "謎" },
                { q: "非常（ㄖㄜˋ）鬧", a: "熱" },
                { q: "（ㄖㄣˋ）識新朋友", a: "認" }
            ],

            // 二、改錯字（5題，每題2分）
            swamp: [
                { q: "媽媽買了很多新鮮的食「才」。", wrong: "才", a: "材" },
                { q: "妹妹喜歡吃脆脆的海「台」。", wrong: "台", a: "苔" },
                { q: "大家一「口」同聲回答正確答案。", wrong: "口", a: "異" },
                { q: "弟弟不小心打「番」了牛奶。", wrong: "番", a: "翻" },
                { q: "哥哥「岡」才扭到腳了。", wrong: "岡", a: "剛" }
            ],

            // 三、部首筆畫造詞（5題，每題4分）
            temple: [
                { q: "變", a: "23畫｜言部｜變成", hint: "請寫出：筆畫數、部首、造詞" },
                { q: "剛", a: "10畫｜刀部｜剛才", hint: "請寫出：筆畫數、部首、造詞" },
                { q: "緊", a: "15畫｜糸部｜緊張", hint: "請寫出：筆畫數、部首、造詞" },
                { q: "享", a: "8畫｜亠部｜分享", hint: "請寫出：筆畫數、部首、造詞" },
                { q: "平", a: "5畫｜干部｜平安", hint: "請寫出：筆畫數、部首、造詞" }
            ],

            // 四、不同讀音（5題，每題2分）
            sound: [
                { 
                    q: "「種」：爸爸在田裡（  ）下百合花的（  ）子。", 
                    options: ["ㄓㄨㄥˋ、ㄓㄨㄥˇ", "ㄓㄨㄥˇ、ㄓㄨㄥˋ", "ㄓㄨㄥˋ、ㄓㄨㄥˋ", "ㄓㄨㄥˇ、ㄓㄨㄥˇ"],
                    a: "ㄓㄨㄥˋ、ㄓㄨㄥˇ"
                },
                { 
                    q: "「好」：妹妹（  ）奇的想知道誰是她的（  ）朋友。", 
                    options: ["ㄏㄠˋ、ㄏㄠˇ", "ㄏㄠˇ、ㄏㄠˋ", "ㄏㄠˋ、ㄏㄠˋ", "ㄏㄠˇ、ㄏㄠˇ"],
                    a: "ㄏㄠˋ、ㄏㄠˇ"
                },
                { 
                    q: "「長」：小草（  ）高了，它的葉子變得很（  ）。", 
                    options: ["ㄓㄤˇ、ㄔㄤˊ", "ㄔㄤˊ、ㄓㄤˇ", "ㄓㄤˇ、ㄓㄤˇ", "ㄔㄤˊ、ㄔㄤˊ"],
                    a: "ㄓㄤˇ、ㄔㄤˊ"
                },
                { 
                    q: "「數」：他（  ）了一下書本的（  ）量。", 
                    options: ["ㄕㄨˇ、ㄕㄨˋ", "ㄕㄨˋ、ㄕㄨˇ", "ㄕㄨˇ、ㄕㄨˇ", "ㄕㄨˋ、ㄕㄨˋ"],
                    a: "ㄕㄨˇ、ㄕㄨˋ"
                },
                { 
                    q: "「更」：（  ）換乾淨的衣服後，看起來（  ）加清爽。", 
                    options: ["ㄍㄥ、ㄍㄥˋ", "ㄍㄥˋ、ㄍㄥ", "ㄍㄥ、ㄍㄥ", "ㄍㄥˋ、ㄍㄥˋ"],
                    a: "ㄍㄥ、ㄍㄥˋ"
                }
            ],

            // 五、照樣造句（3題，每題2分）
            sentence: [
                { q: "例：太陽一出來，立刻暖洋洋。\n請造句：（  ）一（  ），立刻（  ）。", a: "月亮一進去，立刻閒得發慌", hint: "請仿照例句造一個句子" },
                { q: "例：濃濃的香味\n請造句：（  ）的（  ）", a: "淡淡的香氣", hint: "請仿照例句造一個詞組" },
                { q: "例：有了陽光，花朵更美麗了。\n請造句：有了（  ），（  ）更（  ）了。", a: "有了故事，春捲更美味了", hint: "請仿照例句造一個句子" }
            ],

            // 六、閱讀測驗（3題，每題2分）
            maze: {
                passage: "很久以前，有一隻小青蛙住在一口古井裡。有一天，牠遇到一隻大烏龜。大烏龜告訴小青蛙：「我的家在大海，海比古井大得多，游來游去看不到邊界。」小青蛙聽呆了，才知道自己的世界是多麼的小。",
                questions: [
                    { q: "故事中的青蛙住在哪裡？", options: ["大海", "井底", "水草下"], a: "井底" },
                    { q: "下面哪一個適合當這篇故事的題目？", options: ["井底之龜", "海底之蛙", "井底之蛙"], a: "井底之蛙" },
                    { q: "這個故事主要是告訴我們什麼道理？", options: ["要多交朋友", "要多認識外面的世界", "大烏龜不愛玩"], a: "要多認識外面的世界" }
                ]
            }
        };

        const mapBackgrounds = {
            cabin: "images/cabin.jpg",
            swamp: "images/swamp.jpg",
            temple: "images/temple.jpg",
            sound: "images/menu.jpg",
            sentence: "images/menu.jpg",
            maze: "images/maze.jpg"
        };

        const mapNames = {
            cabin: "字林小屋",
            swamp: "錯字沼澤",
            temple: "部首神殿",
            sound: "讀音森林",
            sentence: "造句山谷",
            maze: "閱讀迷宮"
        };

        const gemsPerMap = {
            cabin: 1,
            swamp: 2,
            temple: 4,
            sound: 2,
            sentence: 2,
            maze: 2
        };

        const monsters = {
            wolf: {
                name: "Wolf 🐺",
                icon: "🐺",
                desc: "一隻灰狼出現了！",
                actions: [
                    { text: "🔥 用火把嚇走", requires: { torch: 1 }, consumes: { torch: 1 } },
                    { text: "🗡️ 用苦無打倒", requires: { kunai: 1 }, consumes: { kunai: 1 }, drops: { lowFur: 1 } }
                ]
            },
            alphaWolf: {
                name: "Alpha Wolf 🐺👑",
                icon: "🐺",
                desc: "狼王出現了！比普通狼更強大！",
                actions: [
                    { text: "🗡️ 用苦無 ×2 打倒", requires: { kunai: 2 }, consumes: { kunai: 2 }, drops: { fur: 1 } }
                ]
            },
            polarBear: {
                name: "北極熊 🐻‍❄️",
                icon: "🐻‍❄️",
                desc: "巨大的北極熊！需要完整裝備才能對抗！",
                actions: [
                    { text: "🗡️🧥🐰 全力攻擊", requires: { kunai: 2, fur: 1, rabbitHorn: 1 }, consumes: { kunai: 2, fur: 1, rabbitHorn: 1 }, drops: { sword: 1 } }
                ]
            }
        };

        // ==================== 遊戲狀態 ====================
        
        let gameState = {
            gems: 0,
            food: 2,
            inventory: { torch: 0, rabbitHorn: 0, kunai: 0, lowFur: 0, fur: 0, sword: 0 },
            completedMaps: [],
            currentMap: null,
            currentQuestionIndex: 0,
            retryUsed: false,
            mapsCleared: 0
        };

        let canvas, ctx;
        let isDrawing = false;
        let lastX = 0, lastY = 0;

        // ==================== 畫面切換 ====================
        
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
            updateDisplays();
        }

        function updateDisplays() {
            ['gems-display', 'gems-display2', 'gems-display3'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = gameState.gems;
            });
            ['food-display', 'food-display2', 'food-display3'].forEach(id => {
                const el = document.getElementById(id);
                if (el) el.textContent = gameState.food;
            });
            updateInventoryDisplay();
            updateMapButtons();
        }

        function updateInventoryDisplay() {
            const items = [];
            if (gameState.inventory.torch > 0) items.push(`🔥 ×${gameState.inventory.torch}`);
            if (gameState.inventory.rabbitHorn > 0) items.push(`🐰 ×${gameState.inventory.rabbitHorn}`);
            if (gameState.inventory.kunai > 0) items.push(`🗡️ ×${gameState.inventory.kunai}`);
            if (gameState.inventory.lowFur > 0) items.push(`🧶 ×${gameState.inventory.lowFur}`);
            if (gameState.inventory.fur > 0) items.push(`🧥 ×${gameState.inventory.fur}`);
            if (gameState.inventory.sword > 0) items.push(`⚔️ ×${gameState.inventory.sword}`);
            
            const html = items.length > 0 
                ? items.map(i => `<span class="inv-item">${i}</span>`).join('')
                : '<span class="inv-item">（空）</span>';
            
            document.getElementById('inventory-display').innerHTML = html;
            const inv2 = document.getElementById('inventory-display2');
            if (inv2) inv2.innerHTML = html;
        }

        function updateMapButtons() {
            const maps = ['cabin', 'swamp', 'temple', 'sound', 'sentence', 'maze'];
            maps.forEach(map => {
                const btn = document.getElementById(`map-${map}`);
                if (btn && gameState.completedMaps.includes(map)) {
                    btn.classList.add('completed');
                    if (!btn.textContent.includes('✅')) {
                        btn.textContent = btn.textContent + ' ✅';
                    }
                }
            });
        }

        // ==================== 遊戲開始 ====================
        
        function startGame() {
            gameState = {
                gems: 0,
                food: 2,
                inventory: { torch: 0, rabbitHorn: 0, kunai: 0, lowFur: 0, fur: 0, sword: 0 },
                completedMaps: [],
                currentMap: null,
                currentQuestionIndex: 0,
                retryUsed: false,
                mapsCleared: 0
            };
            showScreen('map-screen');
        }

        // ==================== 地圖 ====================
        
        function enterMap(mapId) {
            if (gameState.completedMaps.includes(mapId)) {
                alert('這個地圖已經完成了！');
                return;
            }
            
            gameState.currentMap = mapId;
            gameState.currentQuestionIndex = 0;
            gameState.retryUsed = false;
            
            const screen = document.getElementById('question-screen');
            screen.style.backgroundImage = `url('${mapBackgrounds[mapId]}')`;
            
            showScreen('question-screen');
            showQuestion();
        }

        // ==================== 手寫畫布 ====================

        function initCanvas() {
            canvas = document.getElementById('writing-canvas');
            if (!canvas) return;
            
            ctx = canvas.getContext('2d');
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseout', stopDrawing);
            canvas.addEventListener('touchstart', handleTouchStart);
            canvas.addEventListener('touchmove', handleTouchMove);
            canvas.addEventListener('touchend', stopDrawing);
        }

        function startDrawing(e) {
            isDrawing = true;
            [lastX, lastY] = [e.offsetX, e.offsetY];
        }

        function draw(e) {
            if (!isDrawing) return;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(e.offsetX, e.offsetY);
            ctx.stroke();
            [lastX, lastY] = [e.offsetX, e.offsetY];
        }

        function stopDrawing() {
            isDrawing = false;
        }

        function handleTouchStart(e) {
            e.preventDefault();
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            isDrawing = true;
            lastX = touch.clientX - rect.left;
            lastY = touch.clientY - rect.top;
        }

        function handleTouchMove(e) {
            e.preventDefault();
            if (!isDrawing) return;
            const touch = e.touches[0];
            const rect = canvas.getBoundingClientRect();
            const x = touch.clientX - rect.left;
            const y = touch.clientY - rect.top;
            ctx.beginPath();
            ctx.moveTo(lastX, lastY);
            ctx.lineTo(x, y);
            ctx.stroke();
            lastX = x;
            lastY = y;
        }

        function clearCanvas() {
            if (ctx) ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        // ==================== 題目 ====================
        
        function showQuestion() {
            const mapId = gameState.currentMap;
            let questionData, totalQuestions;
            
            document.getElementById('reading-passage-container').innerHTML = '';
            document.getElementById('question-hint').textContent = '';
            
            if (mapId === 'maze') {
                questionData = questions.maze.questions[gameState.currentQuestionIndex];
                totalQuestions = questions.maze.questions.length;
                document.getElementById('reading-passage-container').innerHTML = 
                    `<div class="reading-passage">${questions.maze.passage}</div>`;
            } else {
                questionData = questions[mapId][gameState.currentQuestionIndex];
                totalQuestions = questions[mapId].length;
            }
            
            document.getElementById('progress-display').textContent = 
                `${mapNames[mapId]} - 第 ${gameState.currentQuestionIndex + 1} 題，共 ${totalQuestions} 題`;
            
            document.getElementById('question-text').textContent = questionData.q;
            document.getElementById('feedback').textContent = '';
            document.getElementById('feedback').className = 'feedback';
            
            if (questionData.hint) {
                document.getElementById('question-hint').textContent = questionData.hint;
            }
            
            const answerArea = document.getElementById('answer-area');
            
            // 手寫題：cabin, swamp, temple, sentence
            if (['cabin', 'swamp', 'temple', 'sentence'].includes(mapId)) {
                let extraInfo = '';
                if (mapId === 'swamp') {
                    extraInfo = `<p style="margin-bottom:10px; color:#ffaa00;">找出錯字「${questionData.wrong}」並寫出正確的字</p>`;
                }
                
                const canvasHeight = mapId === 'sentence' ? 250 : 200;
                
                answerArea.innerHTML = `
                    ${extraInfo}
                    <div class="canvas-container">
                        <canvas id="writing-canvas" width="280" height="${canvasHeight}"></canvas>
                    </div>
                    <div class="canvas-buttons">
                        <button class="canvas-btn clear-btn" onclick="clearCanvas()">清除</button>
                        <button class="canvas-btn done-btn" onclick="showAnswer()">我寫好了</button>
                    </div>
                    <div id="answer-reveal" style="display:none;"></div>
                `;
                setTimeout(initCanvas, 100);
                
            } else {
                // 選擇題：sound, maze
                const optionsHtml = questionData.options.map(opt => 
                    `<button class="option-btn" onclick="selectOption('${opt}')">${opt}</button>`
                ).join('');
                answerArea.innerHTML = `<div class="answer-options">${optionsHtml}</div>`;
            }
        }

        function showAnswer() {
            const mapId = gameState.currentMap;
            const questionData = questions[mapId][gameState.currentQuestionIndex];
            const gems = gemsPerMap[mapId];
            
            document.getElementById('answer-reveal').style.display = 'block';
            document.getElementById('answer-reveal').innerHTML = `
                <div class="answer-reveal">
                    <p>正確答案：</p>
                    <div class="correct-answer">${questionData.a}</div>
                    <p>你寫對了嗎？</p>
                    <div class="confirm-buttons">
                        <button class="confirm-btn correct-btn" onclick="confirmAnswer(true, ${gems})">✅ 對 +${gems}💎</button>
                        <button class="confirm-btn wrong-btn" onclick="confirmAnswer(false, ${gems})">❌ 錯</button>
                    </div>
                </div>
            `;
        }

        function confirmAnswer(isCorrect, gems) {
            const feedback = document.getElementById('feedback');
            
            if (isCorrect) {
                feedback.textContent = `✅ 正確！+${gems} 💎`;
                feedback.className = 'feedback correct';
                gameState.gems += gems;
                gameState.retryUsed = false;
                setTimeout(() => nextQuestion(), 800);
            } else {
                if (!gameState.retryUsed) {
                    feedback.textContent = '❌ 再試一次！';
                    feedback.className = 'feedback wrong';
                    gameState.retryUsed = true;
                    clearCanvas();
                    document.getElementById('answer-reveal').style.display = 'none';
                } else {
                    feedback.textContent = '❌ 沒關係，繼續加油！';
                    feedback.className = 'feedback wrong';
                    gameState.retryUsed = false;
                    setTimeout(() => nextQuestion(), 1000);
                }
            }
            updateDisplays();
        }

        function selectOption(option) {
            const mapId = gameState.currentMap;
            let correctAnswer, gems;
            
            if (mapId === 'maze') {
                correctAnswer = questions.maze.questions[gameState.currentQuestionIndex].a;
            } else {
                correctAnswer = questions[mapId][gameState.currentQuestionIndex].a;
            }
            gems = gemsPerMap[mapId];
            
            const feedback = document.getElementById('feedback');
            
            if (option === correctAnswer) {
                feedback.textContent = `✅ 正確！+${gems} 💎`;
                feedback.className = 'feedback correct';
                gameState.gems += gems;
                gameState.retryUsed = false;
                setTimeout(() => nextQuestion(), 1000);
            } else {
                if (!gameState.retryUsed) {
                    feedback.textContent = '❌ 錯誤！再試一次';
                    feedback.className = 'feedback wrong';
                    gameState.retryUsed = true;
                } else {
                    feedback.textContent = `❌ 答案是：${correctAnswer}`;
                    feedback.className = 'feedback wrong';
                    gameState.retryUsed = false;
                    setTimeout(() => nextQuestion(), 1500);
                }
            }
            updateDisplays();
        }

        function nextQuestion() {
            const mapId = gameState.currentMap;
            const totalQuestions = mapId === 'maze' 
                ? questions.maze.questions.length 
                : questions[mapId].length;
            
            gameState.currentQuestionIndex++;
            
            if (gameState.currentQuestionIndex >= totalQuestions) {
                completeMap();
            } else {
                showQuestion();
            }
        }

        function completeMap() {
            gameState.completedMaps.push(gameState.currentMap);
            gameState.mapsCleared++;
            gameState.food--;
            
            if (gameState.food < 0) {
                gameOver('你餓死了！記得在商店購買食物。');
                return;
            }
            
            if (gameState.completedMaps.length >= 6) {
                victory();
                return;
            }
            
            if (gameState.mapsCleared >= 3 && Math.random() < 0.6) {
                triggerMonster();
            } else {
                alert(`🎉 ${mapNames[gameState.currentMap]}完成！\n\n消耗 1 食物\n剩餘食物：${gameState.food}`);
                showScreen('map-screen');
            }
        }

        // ==================== 商店 ====================
        
        function openShop() { showScreen('shop-screen'); }
        function closeShop() { showScreen('map-screen'); }

        function buyItem(item) {
            const prices = { food: 3, torch: 4, rabbitHorn: 4, kunai: 10 };
            if (gameState.gems < prices[item]) {
                alert('寶石不足！');
                return;
            }
            gameState.gems -= prices[item];
            if (item === 'food') gameState.food++;
            else gameState.inventory[item]++;
            updateDisplays();
        }

        function craftFur() {
            if (gameState.inventory.lowFur >= 2) {
                gameState.inventory.lowFur -= 2;
                gameState.inventory.fur++;
                alert('合成成功！獲得毛皮 ×1');
                updateDisplays();
            } else {
                alert('需要低等毛皮 ×2 才能合成！');
            }
        }

        // ==================== 怪物 ====================
        
        function triggerMonster() {
            const types = ['wolf', 'wolf', 'alphaWolf'];
            if (gameState.mapsCleared >= 5) types.push('polarBear');
            
            const type = types[Math.floor(Math.random() * types.length)];
            const monster = monsters[type];
            
            document.getElementById('monster-icon').textContent = monster.icon;
            document.getElementById('monster-name').textContent = monster.name;
            document.getElementById('monster-desc').textContent = monster.desc;
            
            const actionsHtml = monster.actions.map((action, i) => {
                const canUse = checkRequirements(action.requires);
                return `<button class="monster-btn" ${canUse ? '' : 'disabled'} 
                    onclick="useMonsterAction('${type}', ${i})">${action.text}</button>`;
            }).join('');
            
            document.getElementById('monster-actions').innerHTML = actionsHtml + 
                `<button class="monster-btn" style="background:#333;" onclick="fleeMonster()">🏃 逃跑（損失一半寶石）</button>`;
            
            showScreen('monster-screen');
        }

        function checkRequirements(req) {
            for (let item in req) {
                if ((gameState.inventory[item] || 0) < req[item]) return false;
            }
            return true;
        }

        function useMonsterAction(type, i) {
            const action = monsters[type].actions[i];
            for (let item in action.consumes) gameState.inventory[item] -= action.consumes[item];
            
            if (action.drops) {
                for (let item in action.drops) {
                    gameState.inventory[item] = (gameState.inventory[item] || 0) + action.drops[item];
                }
                const names = { lowFur: '低等毛皮', fur: '毛皮', sword: '劍' };
                const text = Object.entries(action.drops).map(([k,v]) => `${names[k]} ×${v}`).join(', ');
                alert(`🎉 成功！獲得：${text}`);
            } else {
                alert('🎉 成功擊退怪物！');
            }
            showScreen('map-screen');
        }

        function fleeMonster() {
            gameState.gems = Math.floor(gameState.gems / 2);
            alert(`你逃跑了，損失一半寶石！\n剩餘寶石：${gameState.gems}`);
            showScreen('map-screen');
        }

        // ==================== 結束 ====================
        
        function gameOver(reason) {
            document.getElementById('gameover-reason').textContent = reason;
            showScreen('gameover-screen');
        }

        function victory() {
            document.getElementById('final-stats').innerHTML = 
                `最終寶石：${gameState.gems} 💎<br>收集到的劍：${gameState.inventory.sword} ⚔️`;
            showScreen('victory-screen');
        }
    </script>
</body>
</html>
