<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>森林生存國語挑戰</title>
    <style>

* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    font-family: 'Microsoft JhengHei', 'PingFang TC', sans-serif;
    background: #1a1a2e;
    min-height: 100vh;
    color: white;
    overflow-x: hidden;
}
.screen {
    display: none;
    min-height: 100vh;
    background-size: cover;
    background-position: center;
    padding: 15px;
}
.screen.active {
    display: flex;
    flex-direction: column;
}
.status-bar {
    background: rgba(0,0,0,0.7);
    padding: 12px;
    border-radius: 10px;
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 10px;
    margin-bottom: 15px;
}
.status-item { font-size: 16px; }
#menu-screen {
    background-image: url('images/menu.jpg');
    justify-content: center;
    align-items: center;
    text-align: center;
}
.game-title {
    font-size: 26px;
    text-shadow: 3px 3px 6px black;
    margin-bottom: 40px;
    background: rgba(0,0,0,0.6);
    padding: 20px 25px;
    border-radius: 15px;
}
.menu-btn {
    background: linear-gradient(180deg, #4CAF50, #2E7D32);
    color: white;
    border: none;
    padding: 18px 50px;
    font-size: 22px;
    border-radius: 15px;
    cursor: pointer;
    margin: 10px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.5);
}
#map-screen { background-image: url('images/menu.jpg'); }
.map-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 10px;
    max-width: 400px;
    margin: 0 auto;
}
.map-btn {
    background: rgba(0,0,0,0.7);
    color: white;
    border: 3px solid #666;
    padding: 14px;
    font-size: 15px;
    border-radius: 10px;
    cursor: pointer;
}
.map-btn:hover:not(:disabled) {
    border-color: #4CAF50;
    background: rgba(76,175,80,0.3);
}
.map-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.map-btn.completed { border-color: #4CAF50; }
.monster-countdown {
    background: linear-gradient(180deg, #ff6600, #cc3300);
    border: 2px solid #ff9900;
    border-radius: 10px;
    padding: 12px;
    margin-bottom: 10px;
    text-align: center;
    animation: pulse-warning 1.5s infinite;
}
@keyframes pulse-warning {
    0%, 100% { box-shadow: 0 0 10px rgba(255,102,0,0.5); }
    50% { box-shadow: 0 0 20px rgba(255,102,0,0.8); }
}
.monster-countdown-title { font-size: 14px; color: #ffcc00; margin-bottom: 5px; }
.monster-countdown-info { font-size: 16px; color: white; }
.monster-countdown-prepare { font-size: 12px; color: #ffddaa; margin-top: 8px; }
.question-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    overflow-y: auto;
}
.question-box {
    background: rgba(0,0,0,0.85);
    padding: 20px;
    border-radius: 15px;
    max-width: 500px;
    width: 100%;
    text-align: center;
}
.question-progress { font-size: 14px; color: #aaa; margin-bottom: 12px; }
.question-text { font-size: 18px; line-height: 1.6; margin-bottom: 15px; white-space: pre-wrap; }
.question-hint { font-size: 13px; color: #88ccff; margin-bottom: 12px; }
.stage-indicator {
    background: #333;
    padding: 6px 12px;
    border-radius: 20px;
    font-size: 13px;
    color: #ffd700;
    margin-bottom: 12px;
    display: inline-block;
}
.example-box {
    background: rgba(255,255,255,0.1);
    padding: 12px;
    border-radius: 8px;
    margin-bottom: 15px;
    text-align: left;
}
.example-label { color: #88ccff; font-size: 13px; margin-bottom: 5px; }
.example-text { font-size: 16px; }
.template-text { font-size: 18px; color: #ffd700; margin-bottom: 15px; }
.canvas-container {
    background: white;
    border-radius: 10px;
    padding: 8px;
    margin-bottom: 12px;
    display: inline-block;
}
.writing-canvas {
    border: 3px solid #4CAF50;
    border-radius: 8px;
    background: #fffef0;
    touch-action: none;
    display: block;
}
.canvas-buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    margin-bottom: 12px;
}
.canvas-btn {
    padding: 10px 20px;
    font-size: 15px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
}
.clear-btn { background: #666; color: white; }
.done-btn { background: linear-gradient(180deg, #2196F3, #1565C0); color: white; }
.multi-canvas-container {
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
    margin-bottom: 15px;
}
.single-blank {
    display: flex;
    flex-direction: column;
    align-items: center;
}
.blank-label { font-size: 13px; color: #aaa; margin-bottom: 5px; }
.blank-canvas-wrap {
    background: white;
    border-radius: 8px;
    padding: 5px;
}
.blank-canvas {
    border: 2px solid #4CAF50;
    border-radius: 6px;
    background: #fffef0;
    touch-action: none;
    display: block;
}
.answer-reveal {
    background: rgba(255,255,255,0.1);
    padding: 15px;
    border-radius: 10px;
    margin-top: 12px;
}
.correct-answer { font-size: 28px; margin: 12px 0; color: #4CAF50; }
.answers-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    justify-content: center;
    margin: 15px 0;
}
.answer-item {
    background: #2E7D32;
    padding: 8px 15px;
    border-radius: 8px;
    font-size: 18px;
}
.confirm-buttons {
    display: flex;
    gap: 12px;
    justify-content: center;
    margin-top: 12px;
}
.confirm-btn {
    padding: 12px 25px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}
.correct-btn { background: linear-gradient(180deg, #4CAF50, #2E7D32); color: white; }
.wrong-btn { background: linear-gradient(180deg, #f44336, #c62828); color: white; }
.answer-options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 15px;
}
.option-btn {
    background: #333;
    color: white;
    border: 2px solid #555;
    padding: 12px;
    font-size: 15px;
    border-radius: 10px;
    cursor: pointer;
}
.option-btn:hover { border-color: #4CAF50; background: #444; }
.feedback { margin-top: 12px; font-size: 18px; min-height: 25px; }
.feedback.correct { color: #4CAF50; }
.feedback.wrong { color: #f44336; }
#shop-screen { background-image: url('images/shop.jpg'); }
.shop-container {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    max-width: 400px;
    margin: 0 auto;
}
.shop-item {
    background: rgba(0,0,0,0.8);
    padding: 12px 15px;
    margin: 6px 0;
    border-radius: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.shop-item-info { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.shop-item-icon { font-size: 26px; }
.buy-btn {
    background: linear-gradient(180deg, #FF9800, #F57C00);
    color: white;
    border: none;
    padding: 8px 16px;
    font-size: 14px;
    border-radius: 8px;
    cursor: pointer;
}
.buy-btn:disabled { background: #666; cursor: not-allowed; }
.back-btn {
    background: #555;
    color: white;
    border: none;
    padding: 12px 25px;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
    margin-top: 15px;
}
.inventory {
    background: rgba(0,0,0,0.7);
    padding: 12px;
    border-radius: 10px;
    margin-top: 12px;
}
.inventory-title { font-size: 14px; color: #aaa; margin-bottom: 8px; }
.inventory-items { display: flex; flex-wrap: wrap; gap: 8px; }
.inv-item { background: #333; padding: 6px 10px; border-radius: 8px; font-size: 14px; }
.reading-passage {
    background: rgba(255,255,255,0.1);
    padding: 12px;
    border-radius: 10px;
    margin-bottom: 15px;
    text-align: left;
    line-height: 1.7;
    font-size: 15px;
    max-height: 150px;
    overflow-y: auto;
}
#warning-screen {
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
}
.warning-box {
    background: linear-gradient(180deg, #4a3000, #2a1a00);
    border: 3px solid #ff9800;
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    max-width: 380px;
    width: 95%;
    animation: pulse 1.5s infinite;
}
@keyframes pulse {
    0%, 100% { box-shadow: 0 0 20px rgba(255,152,0,0.5); }
    50% { box-shadow: 0 0 40px rgba(255,152,0,0.8); }
}
.warning-icon {
    font-size: 50px;
    margin-bottom: 10px;
    animation: shake 0.5s infinite;
}
@keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
}
.warning-title { font-size: 22px; color: #ff9800; margin-bottom: 10px; }
.warning-monster { font-size: 18px; color: #fff; margin-bottom: 15px; }
.warning-tip { font-size: 14px; color: #aaa; margin: 15px 0; }
.warning-requirements {
    background: rgba(0,0,0,0.5);
    border: 2px solid #ff9800;
    border-radius: 10px;
    padding: 15px;
    margin: 15px 0;
    text-align: left;
}
.warning-requirements-title {
    font-size: 15px;
    color: #ff9800;
    margin-bottom: 10px;
    text-align: center;
}
.warning-requirement-item {
    background: rgba(255,255,255,0.1);
    padding: 10px;
    border-radius: 8px;
    margin: 8px 0;
}
.warning-requirement-items { font-size: 15px; color: #fff; margin-bottom: 5px; }
.warning-requirement-desc { font-size: 12px; color: #aaa; }
.warning-requirement-cost { font-size: 12px; color: #ffd700; margin-top: 3px; }
.warning-or { text-align: center; color: #888; font-size: 13px; margin: 5px 0; }
.warning-inventory {
    background: rgba(0,100,0,0.3);
    border: 1px solid #4CAF50;
    border-radius: 8px;
    padding: 10px;
    margin-top: 12px;
}
.warning-inventory-title { font-size: 13px; color: #4CAF50; margin-bottom: 5px; }
.warning-inventory-items { font-size: 14px; color: #fff; }
.warning-buttons { display: flex; flex-direction: column; gap: 10px; }
.warning-btn {
    padding: 14px 25px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    cursor: pointer;
}
.warning-btn.shop-btn { background: linear-gradient(180deg, #FF9800, #F57C00); color: white; }
.warning-btn.fight-btn { background: linear-gradient(180deg, #aa0000, #660000); color: white; }
#monster-screen {
    background: rgba(0,0,0,0.9);
    justify-content: center;
    align-items: center;
}
.monster-box {
    background: rgba(50,0,0,0.9);
    border: 3px solid #aa0000;
    padding: 30px;
    border-radius: 20px;
    text-align: center;
    max-width: 350px;
}
.monster-icon { font-size: 70px; margin-bottom: 15px; }
.monster-name { font-size: 24px; color: #ff6666; margin-bottom: 12px; }
.monster-desc { font-size: 14px; color: #ccc; margin-bottom: 15px; }
.monster-actions { display: flex; flex-direction: column; gap: 8px; }
.monster-btn {
    background: linear-gradient(180deg, #aa0000, #660000);
    color: white;
    border: none;
    padding: 12px;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
}
.monster-btn:disabled { background: #444; cursor: not-allowed; }
#gameover-screen, #victory-screen {
    background: rgba(0,0,0,0.95);
    justify-content: center;
    align-items: center;
    text-align: center;
}
.gameover-box { padding: 30px; }
.gameover-title { font-size: 32px; color: #f44336; margin-bottom: 15px; }
.gameover-reason { font-size: 18px; color: #ccc; margin-bottom: 25px; }
.victory-title { font-size: 32px; color: #4CAF50; margin-bottom: 15px; }
    </style>
</head>
<body>
    <!-- 主選單 -->
    <div id="menu-screen" class="screen active">
        <h1 class="game-title">🌲 森林生存國語挑戰 🌲</h1>
        <button class="menu-btn" onclick="startGame()">開始遊戲</button>
    </div>
    <!-- 地圖選擇 -->
    <div id="map-screen" class="screen">
        <div class="status-bar">
            <span class="status-item">💎 <span id="gems-display">0</span></span>
            <span class="status-item">🍙 <span id="food-display">0</span></span>
        </div>
        <div class="inventory">
            <div class="inventory-title">🎒 背包</div>
            <div class="inventory-items" id="inventory-display"></div>
        </div>
        <div id="monster-countdown-container"></div>
        <div class="map-container">
            <button class="map-btn" id="map-cabin" onclick="enterMap('cabin')">🏚️ 字林小屋（生字填空）</button>
            <button class="map-btn" id="map-swamp" onclick="enterMap('swamp')">🐸 錯字沼澤（改錯字）</button>
            <button class="map-btn" id="map-temple" onclick="enterMap('temple')">🏛️ 部首神殿（筆畫·部首·造詞）</button>
            <button class="map-btn" id="map-sound" onclick="enterMap('sound')">🎵 讀音森林（不同讀音）</button>
            <button class="map-btn" id="map-sentence" onclick="enterMap('sentence')">✏️ 造句山谷（照樣造句）</button>
            <button class="map-btn" id="map-maze" onclick="enterMap('maze')">🌙 閱讀迷宮（閱讀測驗）</button>
            <button class="map-btn" onclick="openShop()">🛒 商店</button>
        </div>
    </div>
    <!-- 題目畫面 -->
    <div id="question-screen" class="screen">
        <div class="status-bar">
            <span class="status-item">💎 <span id="gems-display2">0</span></span>
            <span class="status-item">🍙 <span id="food-display2">0</span></span>
        </div>
        <div class="question-container">
            <div class="question-box">
                <div class="question-progress" id="progress-display"></div>
                <div id="stage-display"></div>
                <div id="reading-passage-container"></div>
                <div id="example-container"></div>
                <div class="question-text" id="question-text"></div>
                <div class="question-hint" id="question-hint"></div>
                <div id="answer-area"></div>
                <div class="feedback" id="feedback"></div>
            </div>
        </div>
    </div>
    <!-- 商店 -->
    <div id="shop-screen" class="screen">
        <div class="status-bar">
            <span class="status-item">💎 <span id="gems-display3">0</span></span>
            <span class="status-item">🍙 <span id="food-display3">0</span></span>
        </div>
        <div class="inventory">
            <div class="inventory-title">🎒 背包</div>
            <div class="inventory-items" id="inventory-display2"></div>
        </div>
        <div class="shop-container">
            <div class="shop-item">
                <div class="shop-item-info"><span class="shop-item-icon">🍙</span> 食物</div>
                <button class="buy-btn" onclick="buyItem('food')">3 💎</button>
            </div>
            <div class="shop-item">
                <div class="shop-item-info"><span class="shop-item-icon">🔥</span> 火把</div>
                <button class="buy-btn" onclick="buyItem('torch')">4 💎</button>
            </div>
            <div class="shop-item">
                <div class="shop-item-info"><span class="shop-item-icon">🐰</span> 兔子角</div>
                <button class="buy-btn" onclick="buyItem('rabbitHorn')">4 💎</button>
            </div>
            <div class="shop-item">
                <div class="shop-item-info"><span class="shop-item-icon">🗡️</span> 苦無</div>
                <button class="buy-btn" onclick="buyItem('kunai')">10 💎</button>
            </div>
            <div class="shop-item">
                <div class="shop-item-info"><span class="shop-item-icon">🧵</span> 合成毛皮</div>
                <button class="buy-btn" onclick="craftFur()">低等×2</button>
            </div>
            <button class="back-btn" id="shop-back-btn" onclick="closeShop()">返回地圖</button>
        </div>
    </div>
    <!-- 怪物預警 -->
    <div id="warning-screen" class="screen">
        <div class="warning-box">
            <div class="warning-icon">⚠️</div>
            <div class="warning-title" id="warning-title">夜晚即將來臨！</div>
            <div class="warning-monster" id="warning-monster">🐺 Wolf 正在接近...</div>
            <div class="warning-requirements" id="warning-requirements"></div>
            <div class="warning-tip">請做好準備！</div>
            <div class="warning-buttons">
                <button class="warning-btn shop-btn" onclick="goToShopFromWarning()">🛒 進入商店準備</button>
                <button class="warning-btn fight-btn" onclick="proceedToMonster()">⚔️ 直接面對</button>
            </div>
        </div>
    </div>
    <!-- 怪物事件 -->
    <div id="monster-screen" class="screen">
        <div class="monster-box">
            <div class="monster-icon" id="monster-icon">🐺</div>
            <div class="monster-name" id="monster-name">Wolf</div>
            <div class="monster-desc" id="monster-desc"></div>
            <div class="monster-actions" id="monster-actions"></div>
        </div>
    </div>
    <!-- 遊戲結束 -->
    <div id="gameover-screen" class="screen">
        <div class="gameover-box">
            <h1 class="gameover-title">💀 遊戲結束</h1>
            <p class="gameover-reason" id="gameover-reason"></p>
            <button class="menu-btn" onclick="location.reload()">重新開始</button>
        </div>
    </div>
    <!-- 勝利畫面 -->
    <div id="victory-screen" class="screen">
        <div class="gameover-box">
            <h1 class="victory-title">🎉 恭喜過關！</h1>
            <p style="font-size: 18px; margin-bottom: 25px;">你成功在森林中生存下來！</p>
            <p style="font-size: 16px; color: #aaa;" id="final-stats"></p>
            <button class="menu-btn" onclick="location.reload()">再玩一次</button>
        </div>
    </div>
    <script>
// ==================== 除錯用 ====================
function debugLog(msg) {
    console.log(msg);
    // 在畫面上也顯示
    let debugDiv = document.getElementById('debug-output');
    if (!debugDiv) {
        debugDiv = document.createElement('div');
        debugDiv.id = 'debug-output';
        debugDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;background:black;color:lime;padding:10px;font-size:12px;z-index:9999;max-height:150px;overflow:auto;';
        document.body.appendChild(debugDiv);
    }
    debugDiv.innerHTML += msg + '<br>';
}

debugLog('腳本開始載入...');

// ==================== 題庫 ====================
const questions = {
    cabin: [
        { q: "（ㄎㄜˋ）家文化園區", a: "客" },
        { q: "（ㄊㄧˇ）驗活動", a: "體" },
        { q: "最有（ㄑㄩˋ）", a: "趣" },
        { q: "（ㄖㄜˋ）呼呼的開水", a: "熱" },
        { q: "（ㄔㄨㄥ）泡擂茶", a: "沖" }
    ],
    swamp: [
        { q: "媽媽買了很多新鮮的食才。", a: "材" },
        { q: "妹妹喜歡吃脆脆的海台。", a: "苔" },
        { q: "大家一口同聲回答正確答案。", a: "異" }
    ],
    temple: [
        { word: "變", stages: [
            { q: "請問「變」有幾畫？", a: "23", hint: "數一數筆畫" },
            { q: "請問「變」的部首？", a: "言", hint: "寫出部首" },
            { q: "請用「變」造詞", a: "變成", hint: "" }
        ]}
    ],
    sound: [
        { q: "「種」：爸爸在田裡（  ）下百合花的（  ）子。", 
          options: ["ㄓㄨㄥˋ、ㄓㄨㄥˇ", "ㄓㄨㄥˇ、ㄓㄨㄥˋ", "ㄓㄨㄥˋ、ㄓㄨㄥˋ", "ㄓㄨㄥˇ、ㄓㄨㄥˇ"], 
          a: "ㄓㄨㄥˋ、ㄓㄨㄥˇ" }
    ],
    sentence: [
        { example: "太陽一出來，立刻暖洋洋。", template: "（①）一（②），立刻（③）。", blanks: 3, answers: ["月亮", "進去", "閒得發慌"] }
    ],
    maze: {
        passage: "很久以前，有一隻小青蛙住在一口古井裡。",
        questions: [
            { q: "青蛙住在哪裡？", options: ["大海", "井底", "水草下"], a: "井底" }
        ]
    }
};

const mapBackgrounds = {
    cabin: "images/cabin.jpg",
    swamp: "images/swamp.jpg",
    temple: "images/temple.jpg",
    sound: "images/menu.jpg",
    sentence: "images/menu.jpg",
    maze: "images/maze.jpg"
};

const mapNames = {
    cabin: "字林小屋",
    swamp: "錯字沼澤",

// ==================== 工具函數 ====================
function shuffleArray(array) {
    const arr = [...array];
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

        allScreens[i].classList.remove('active');
    }
    
    var targetScreen = document.getElementById(screenId);

        targetScreen.classList.add('active');
        debugLog('成功顯示: ' + screenId);
    } else {

// ==================== 手寫畫布 ====================
function initSingleCanvas(canvasId) {
    var canvas = document.getElementById(canvasId);
    if (!canvas) return null;
    
    var ctx = canvas.getContext('2d');
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    var isDrawing = false;
    var lastX = 0, lastY = 0;

    canvas.addEventListener('mousedown', function(e) {
        isDrawing = true;
        lastX = e.offsetX;
        lastY = e.offsetY;
    });
    
    canvas.addEventListener('mousemove', function(e) {
        if (!isDrawing) return;
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(e.offsetX, e.offsetY);
        ctx.stroke();
        lastX = e.offsetX;
        lastY = e.offsetY;
    });
    
    canvas.addEventListener('mouseup', function() { isDrawing = false; });
    canvas.addEventListener('mouseout', function() { isDrawing = false; });

    canvas.addEventListener('touchstart', function(e) {
        e.preventDefault();
        var touch = e.touches[0];
        var rect = canvas.getBoundingClientRect();
        isDrawing = true;
        lastX = touch.clientX - rect.left;
        lastY = touch.clientY - rect.top;
    });
    
    canvas.addEventListener('touchmove', function(e) {
        e.preventDefault();
        if (!isDrawing) return;
        var touch = e.touches[0];
        var rect = canvas.getBoundingClientRect();
        var x = touch.clientX - rect.left;
        var y = touch.clientY - rect.top;
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
        lastX = x;
        lastY = y;
    });
    
    canvas.addEventListener('touchend', function() { isDrawing = false; });

    return ctx;
}

function clearAllCanvases() {
    for (var i = 0; i < canvasContexts.length; i++) {
        var ctx = canvasContexts[i];
        if (ctx) ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height);
    }
}

function clearSingleCanvas(canvasId) {
    var canvas = document.getElementById(canvasId);
    if (canvas) {
        var ctx = canvas.getContext('2d');
        ctx.clearRect(0, 0, canvas.width, canvas.height);
    }
}

// ==================== 答案處理 ====================
function showAnswer() {
    var questionData = questions[gameState.currentMap][gameState.currentQuestionIndex];
    var gems = gameState.currentMap === 'cabin' ? 1 : 2;
    
    var revealEl = document.getElementById('answer-reveal');
    revealEl.style.display = 'block';
    revealEl.innerHTML = '<div class="answer-reveal"><p>正確答案：</p><div class="correct-answer">' + questionData.a + '</div><p>你寫對了嗎？</p><div class="confirm-buttons"><button class="confirm-btn correct-btn" onclick="confirmAnswer(true, ' + gems + ')">✅ 對 +' + gems + '💎</button><button class="confirm-btn wrong-btn" onclick="confirmAnswer(false, ' + gems + ')">❌ 錯</button></div></div>';
}

function showTempleAnswer() {
    var stageData = questions.temple[gameState.currentQuestionIndex].stages[gameState.currentStageIndex];
    
    var revealEl = document.getElementById('answer-reveal');
    revealEl.style.display = 'block';
    revealEl.innerHTML = '<div class="answer-reveal"><p>正確答案：</p><div class="correct-answer">' + stageData.a + '</div><p>你寫對了嗎？</p><div class="confirm-buttons"><button class="confirm-btn correct-btn" onclick="confirmTempleAnswer(true)">✅ 對</button><button class="confirm-btn wrong-btn" onclick="confirmTempleAnswer(false)">❌ 錯</button></div></div>';
}

function showSentenceAnswer() {
    var questionData = questions.sentence[gameState.currentQuestionIndex];
    
    var answersHtml = '<div class="answers-list">';
    for (var i = 0; i < questionData.answers.length; i++) {
        answersHtml += '<span class="answer-item">第' + (i+1) + '格：' + questionData.answers[i] + '</span>';
    }
    answersHtml += '</div>';
    
    var revealEl = document.getElementById('answer-reveal');
    revealEl.style.display = 'block';
    revealEl.innerHTML = '<div class="answer-reveal"><p>正確答案：</p>' + answersHtml + '<p style="margin-top:15px;">你寫對了嗎？</p><div class="confirm-buttons"><button class="confirm-btn correct-btn" onclick="confirmAnswer(true, 2)">✅ 對 +2💎</button><button class="confirm-btn wrong-btn" onclick="confirmAnswer(false, 2)">❌ 錯</button></div></div>';
}

function confirmAnswer(isCorrect, gems) {
    var feedback = document.getElementById('feedback');
    
    if (isCorrect) {
        feedback.textContent = '✅ 正確！+' + gems + ' 💎';
        feedback.className = 'feedback correct';
        gameState.gems += gems;
        gameState.retryUsed = false;
        setTimeout(function() { nextQuestion(); }, 800);
    } else {
        if (!gameState.retryUsed) {
            feedback.textContent = '❌ 再試一次！';
            feedback.className = 'feedback wrong';
            gameState.retryUsed = true;
            clearAllCanvases();
            document.getElementById('answer-reveal').style.display = 'none';
        } else {
            feedback.textContent = '❌ 沒關係，繼續加油！';
            feedback.className = 'feedback wrong';
            gameState.retryUsed = false;
            setTimeout(function() { nextQuestion(); }, 1000);
        }
    }
    updateDisplays();
}

function confirmTempleAnswer(isCorrect) {
    var feedback = document.getElementById('feedback');
    
    if (isCorrect) {
        gameState.templeStageCorrect++;
        feedback.textContent = '✅ 正確！';
        feedback.className = 'feedback correct';
    } else {
        feedback.textContent = '❌ 錯誤';
        feedback.className = 'feedback wrong';
    }
    
    gameState.currentStageIndex++;
    
    if (gameState.currentStageIndex < 3) {
        setTimeout(function() { showTempleQuestion(); }, 800);
    } else {
        var gems = Math.floor(gameState.templeStageCorrect * 4 / 3);
        if (gems > 0) {
            gameState.gems += gems;
            feedback.textContent = '🎉 本題完成！+' + gems + ' 💎';
            feedback.className = 'feedback correct';
        } else {
            feedback.textContent = '😢 本題沒有得分，繼續加油！';
            feedback.className = 'feedback wrong';
        }
        
        updateDisplays();
        
        gameState.currentStageIndex = 0;
        gameState.templeStageCorrect = 0;
        gameState.currentQuestionIndex++;
        
        setTimeout(function() {
            if (gameState.currentQuestionIndex >= questions.temple.length) {
                completeMap();
            } else {
                showTempleQuestion();
            }
        }, 1200);
    }
}

function selectOption(option) {
    var mapId = gameState.currentMap;
    var correctAnswer;
    
    if (mapId === 'maze') {
        correctAnswer = questions.maze.questions[gameState.currentQuestionIndex].a;
    } else {
        correctAnswer = questions[mapId][gameState.currentQuestionIndex].a;
    }
    
    var feedback = document.getElementById('feedback');
    var gems = 2;
    
    if (option === correctAnswer) {
        feedback.textContent = '✅ 正確！+' + gems + ' 💎';
        feedback.className = 'feedback correct';
        gameState.gems += gems;
        gameState.retryUsed = false;
        setTimeout(function() { nextQuestion(); }, 1000);
    } else {
        if (!gameState.retryUsed) {
            feedback.textContent = '❌ 錯誤！再試一次';
            feedback.className = 'feedback wrong';
            gameState.retryUsed = true;
        } else {
            feedback.textContent = '❌ 答案是：' + correctAnswer;
            feedback.className = 'feedback wrong';
            gameState.retryUsed = false;
            setTimeout(function() { nextQuestion(); }, 1500);
        }
    }
    updateDisplays();
}

function nextQuestion() {
    var mapId = gameState.currentMap;
    var totalQuestions;
    
    if (mapId === 'maze') {
        totalQuestions = questions.maze.questions.length;
    } else {
        totalQuestions = questions[mapId].length;
    }
    
    gameState.currentQuestionIndex++;
    
    if (gameState.currentQuestionIndex >= totalQuestions) {
        completeMap();
    } else {
        showQuestion();
    }
}

function completeMap() {
    gameState.completedMaps.push(gameState.currentMap);
    gameState.mapsCleared++;
    gameState.food--;

    if (gameState.food < 0) {
        gameOver('你餓死了！記得在商店購買食物。');
        return;
    }

    if (gameState.completedMaps.length >= 6) {
        victory();
    } else {
        alert('🎉 ' + mapNames[gameState.currentMap] + '完成！\n\n🍙 消耗 1 食物\n🍙 剩餘食物：' + gameState.food);
        showScreen('map-screen');
    }
}

function gameOver(reason) {
    var reasonEl = document.getElementById('gameover-reason');
    if (reasonEl) reasonEl.textContent = reason;
    showScreen('gameover-screen');
}

function victory() {
    var statsEl = document.getElementById('final-stats');
    if (statsEl) {
        statsEl.innerHTML = '最終寶石：' + gameState.gems + ' 💎<br>收集到的劍：' + gameState.inventory.sword + ' ⚔️';
    }
    showScreen('victory-screen');
}

function triggerMonster(type) {
    showScreen('map-screen');
}

function goToShopFromWarning() {
    gameState.fromWarningShop = true;
    showScreen('shop-screen');
}

function proceedToMonster() {
    triggerMonster(gameState.pendingMonster);
}

function fleeMonster() {
    gameState.gems = Math.floor(gameState.gems / 2);
    alert('你逃跑了，損失一半寶石！\n剩餘寶石：' + gameState.gems);
    showScreen('map-screen');
}
