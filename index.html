<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>森林生存國語挑戰</title>
    <style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Microsoft JhengHei', sans-serif; background: #1a1a2e; min-height: 100vh; color: white; }
.screen { display: none; min-height: 100vh; background-size: cover; background-position: center; padding: 15px; }
.screen.active { display: flex; flex-direction: column; }
.status-bar { background: rgba(0,0,0,0.7); padding: 12px; border-radius: 10px; display: flex; justify-content: space-around; gap: 10px; margin-bottom: 15px; }
.status-item { font-size: 16px; }
#menu-screen { justify-content: center; align-items: center; text-align: center; }
.game-title { font-size: 26px; text-shadow: 3px 3px 6px black; margin-bottom: 40px; background: rgba(0,0,0,0.6); padding: 20px 25px; border-radius: 15px; }
.menu-btn { background: linear-gradient(180deg, #4CAF50, #2E7D32); color: white; border: none; padding: 18px 50px; font-size: 22px; border-radius: 15px; cursor: pointer; }
.map-container { flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 10px; max-width: 400px; margin: 0 auto; }
.map-btn { background: rgba(0,0,0,0.7); color: white; border: 3px solid #666; padding: 14px; font-size: 15px; border-radius: 10px; cursor: pointer; }
.map-btn:hover:not(:disabled) { border-color: #4CAF50; background: rgba(76,175,80,0.3); }
.map-btn.completed { border-color: #4CAF50; }
.monster-countdown { background: linear-gradient(180deg, #ff6600, #cc3300); border: 2px solid #ff9900; border-radius: 10px; padding: 12px; margin-bottom: 10px; text-align: center; }
.monster-countdown-title { font-size: 14px; color: #ffcc00; margin-bottom: 5px; }
.monster-countdown-info { font-size: 16px; color: white; }
.monster-countdown-prepare { font-size: 12px; color: #ffddaa; margin-top: 8px; }
.question-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; }
.question-box { background: rgba(0,0,0,0.85); padding: 20px; border-radius: 15px; max-width: 500px; width: 100%; text-align: center; }
.question-progress { font-size: 14px; color: #aaa; margin-bottom: 12px; }
.question-text { font-size: 18px; line-height: 1.6; margin-bottom: 15px; }
.question-hint { font-size: 13px; color: #88ccff; margin-bottom: 12px; }
.stage-indicator { background: #333; padding: 6px 12px; border-radius: 20px; font-size: 13px; color: #ffd700; margin-bottom: 12px; display: inline-block; }
.example-box { background: rgba(255,255,255,0.1); padding: 12px; border-radius: 8px; margin-bottom: 15px; text-align: left; }
.example-label { color: #88ccff; font-size: 13px; margin-bottom: 5px; }
.template-text { font-size: 18px; color: #ffd700; margin-bottom: 15px; }
.canvas-container { background: white; border-radius: 10px; padding: 8px; margin-bottom: 12px; display: inline-block; }
.writing-canvas { border: 3px solid #4CAF50; border-radius: 8px; background: #fffef0; touch-action: none; display: block; }
.canvas-buttons { display: flex; gap: 10px; justify-content: center; margin-bottom: 12px; }
.canvas-btn { padding: 10px 20px; font-size: 15px; border: none; border-radius: 8px; cursor: pointer; }
.clear-btn { background: #666; color: white; }
.done-btn { background: linear-gradient(180deg, #2196F3, #1565C0); color: white; }
.multi-canvas-container { display: flex; flex-wrap: wrap; gap: 15px; justify-content: center; margin-bottom: 15px; }
.single-blank { display: flex; flex-direction: column; align-items: center; }
.blank-label { font-size: 13px; color: #aaa; margin-bottom: 5px; }
.blank-canvas-wrap { background: white; border-radius: 8px; padding: 5px; }
.blank-canvas { border: 2px solid #4CAF50; border-radius: 6px; background: #fffef0; touch-action: none; display: block; }
.answer-reveal { background: rgba(255,255,255,0.1); padding: 15px; border-radius: 10px; margin-top: 12px; }
.correct-answer { font-size: 28px; margin: 12px 0; color: #4CAF50; }
.answers-list { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin: 15px 0; }
.answer-item { background: #2E7D32; padding: 8px 15px; border-radius: 8px; font-size: 18px; }
.confirm-buttons { display: flex; gap: 12px; justify-content: center; margin-top: 12px; }
.confirm-btn { padding: 12px 25px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; }
.correct-btn { background: linear-gradient(180deg, #4CAF50, #2E7D32); color: white; }
.wrong-btn { background: linear-gradient(180deg, #f44336, #c62828); color: white; }
.answer-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 15px; }
.option-btn { background: #333; color: white; border: 2px solid #555; padding: 12px; font-size: 15px; border-radius: 10px; cursor: pointer; }
.option-btn:hover { border-color: #4CAF50; }
.feedback { margin-top: 12px; font-size: 18px; min-height: 25px; }
.feedback.correct { color: #4CAF50; }
.feedback.wrong { color: #f44336; }
.shop-container { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 400px; margin: 0 auto; }
.shop-item { background: rgba(0,0,0,0.8); padding: 12px 15px; margin: 6px 0; border-radius: 10px; display: flex; justify-content: space-between; align-items: center; }
.shop-item-info { display: flex; align-items: center; gap: 8px; font-size: 16px; }
.shop-item-icon { font-size: 26px; }
.buy-btn { background: linear-gradient(180deg, #FF9800, #F57C00); color: white; border: none; padding: 8px 16px; font-size: 14px; border-radius: 8px; cursor: pointer; }
.back-btn { background: #555; color: white; border: none; padding: 12px 25px; font-size: 16px; border-radius: 10px; cursor: pointer; margin-top: 15px; }
.inventory { background: rgba(0,0,0,0.7); padding: 12px; border-radius: 10px; margin-top: 12px; }
.inventory-title { font-size: 14px; color: #aaa; margin-bottom: 8px; }
.inventory-items { display: flex; flex-wrap: wrap; gap: 8px; }
.inv-item { background: #333; padding: 6px 10px; border-radius: 8px; font-size: 14px; }
.reading-passage { background: rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; margin-bottom: 15px; text-align: left; line-height: 1.7; font-size: 15px; max-height: 150px; overflow-y: auto; }
#warning-screen { background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
.warning-box { background: linear-gradient(180deg, #4a3000, #2a1a00); border: 3px solid #ff9800; padding: 25px; border-radius: 20px; text-align: center; max-width: 380px; width: 95%; }
.warning-icon { font-size: 50px; margin-bottom: 10px; }
.warning-title { font-size: 22px; color: #ff9800; margin-bottom: 10px; }
.warning-monster { font-size: 18px; color: #fff; margin-bottom: 15px; }
.warning-requirements { background: rgba(0,0,0,0.5); border: 2px solid #ff9800; border-radius: 10px; padding: 15px; margin: 15px 0; text-align: left; }
.warning-requirements-title { font-size: 15px; color: #ff9800; margin-bottom: 10px; text-align: center; }
.warning-requirement-item { background: rgba(255,255,255,0.1); padding: 10px; border-radius: 8px; margin: 8px 0; }
.warning-requirement-items { font-size: 15px; color: #fff; }
.warning-requirement-desc { font-size: 12px; color: #aaa; }
.warning-requirement-cost { font-size: 12px; color: #ffd700; margin-top: 3px; }
.warning-or { text-align: center; color: #888; font-size: 13px; }
.warning-inventory { background: rgba(0,100,0,0.3); border: 1px solid #4CAF50; border-radius: 8px; padding: 10px; margin-top: 12px; }
.warning-inventory-title { font-size: 13px; color: #4CAF50; margin-bottom: 5px; }
.warning-buttons { display: flex; flex-direction: column; gap: 10px; }
.warning-btn { padding: 14px 25px; font-size: 16px; border: none; border-radius: 10px; cursor: pointer; }
.warning-btn.shop-btn { background: linear-gradient(180deg, #FF9800, #F57C00); color: white; }
.warning-btn.fight-btn { background: linear-gradient(180deg, #aa0000, #660000); color: white; }
#monster-screen { background: rgba(0,0,0,0.9); justify-content: center; align-items: center; }
.monster-box { background: rgba(50,0,0,0.9); border: 3px solid #aa0000; padding: 30px; border-radius: 20px; text-align: center; max-width: 350px; }
.monster-icon { font-size: 70px; margin-bottom: 15px; }
.monster-name { font-size: 24px; color: #ff6666; margin-bottom: 12px; }
.monster-desc { font-size: 14px; color: #ccc; margin-bottom: 15px; }
.monster-actions { display: flex; flex-direction: column; gap: 8px; }
.monster-btn { background: linear-gradient(180deg, #aa0000, #660000); color: white; border: none; padding: 12px; font-size: 16px; border-radius: 10px; cursor: pointer; }
.monster-btn:disabled { background: #444; }
#gameover-screen, #victory-screen { background: rgba(0,0,0,0.95); justify-content: center; align-items: center; text-align: center; }
.gameover-box { padding: 30px; }
.gameover-title { font-size: 32px; color: #f44336; margin-bottom: 15px; }
.gameover-reason { font-size: 18px; color: #ccc; margin-bottom: 25px; }
.victory-title { font-size: 32px; color: #4CAF50; margin-bottom: 15px; }
    </style>
</head>
<body>
<div id="menu-screen" class="screen active">
    <h1 class="game-title">🌲 森林生存國語挑戰 🌲</h1>
    <button class="menu-btn" onclick="startGame()">開始遊戲</button>
</div>

<div id="map-screen" class="screen">
    <div class="status-bar">
        <span class="status-item">💎 <span id="gems-display">0</span></span>
        <span class="status-item">🍙 <span id="food-display">0</span></span>
    </div>
    <div class="inventory"><div class="inventory-title">🎒 背包</div><div class="inventory-items" id="inventory-display"></div></div>
    <div id="monster-countdown-container"></div>
    <div class="map-container">
        <button class="map-btn" id="map-cabin" onclick="enterMap('cabin')">🏚️ 字林小屋（生字填空）</button>
        <button class="map-btn" id="map-swamp" onclick="enterMap('swamp')">🐸 錯字沼澤（改錯字）</button>
        <button class="map-btn" id="map-temple" onclick="enterMap('temple')">🏛️ 部首神殿（筆畫·部首·造詞）</button>
        <button class="map-btn" id="map-sound" onclick="enterMap('sound')">🎵 讀音森林（不同讀音）</button>
        <button class="map-btn" id="map-sentence" onclick="enterMap('sentence')">✏️ 造句山谷（照樣造句）</button>
        <button class="map-btn" id="map-maze" onclick="enterMap('maze')">🌙 閱讀迷宮（閱讀測驗）</button>
        <button class="map-btn" onclick="openShop()">🛒 商店</button>
    </div>
</div>

<div id="question-screen" class="screen">
    <div class="status-bar">
        <span class="status-item">💎 <span id="gems-display2">0</span></span>
        <span class="status-item">🍙 <span id="food-display2">0</span></span>
    </div>
    <div class="question-container">
        <div class="question-box">
            <div class="question-progress" id="progress-display"></div>
            <div id="stage-display"></div>
            <div id="reading-passage-container"></div>
            <div id="example-container"></div>
            <div class="question-text" id="question-text"></div>
            <div class="question-hint" id="question-hint"></div>
            <div id="answer-area"></div>
            <div class="feedback" id="feedback"></div>
        </div>
    </div>
</div>

<div id="shop-screen" class="screen">
    <div class="status-bar">
        <span class="status-item">💎 <span id="gems-display3">0</span></span>
        <span class="status-item">🍙 <span id="food-display3">0</span></span>
    </div>
    <div class="inventory"><div class="inventory-title">🎒 背包</div><div class="inventory-items" id="inventory-display2"></div></div>
    <div class="shop-container">
        <div class="shop-item"><div class="shop-item-info"><span class="shop-item-icon">🍙</span> 食物</div><button class="buy-btn" onclick="buyItem('food')">3 💎</button></div>
        <div class="shop-item"><div class="shop-item-info"><span class="shop-item-icon">🔥</span> 火把</div><button class="buy-btn" onclick="buyItem('torch')">4 💎</button></div>
        <div class="shop-item"><div class="shop-item-info"><span class="shop-item-icon">🦶</span> 兔子腳</div><button class="buy-btn" onclick="buyItem('rabbitFoot')">4 💎</button></div>
        <div class="shop-item"><div class="shop-item-info"><span class="shop-item-icon">🗡️</span> 苦無</div><button class="buy-btn" onclick="buyItem('kunai')">8 💎</button></div>
        <div class="shop-item"><div class="shop-item-info"><span class="shop-item-icon">🧵</span> 合成毛皮</div><button class="buy-btn" onclick="craftFur()">低等×2</button></div>
        <button class="back-btn" id="shop-back-btn" onclick="closeShop()">返回地圖</button>
    </div>
</div>

<div id="warning-screen" class="screen">
    <div class="warning-box">
        <div class="warning-icon">⚠️</div>
        <div class="warning-title" id="warning-title">夜晚即將來臨！</div>
        <div class="warning-monster" id="warning-monster">🐺 Wolf 正在接近...</div>
        <div class="warning-requirements" id="warning-requirements"></div>
        <div class="warning-buttons">
            <button class="warning-btn shop-btn" onclick="goToShopFromWarning()">🛒 進入商店準備</button>
            <button class="warning-btn fight-btn" onclick="proceedToMonster()">⚔️ 直接面對</button>
        </div>
    </div>
</div>

<div id="monster-screen" class="screen">
    <div class="monster-box">
        <div class="monster-icon" id="monster-icon">🐺</div>
        <div class="monster-name" id="monster-name">Wolf</div>
        <div class="monster-desc" id="monster-desc"></div>
        <div class="monster-actions" id="monster-actions"></div>
    </div>
</div>

<div id="gameover-screen" class="screen">
    <div class="gameover-box">
        <h1 class="gameover-title">💀 遊戲結束</h1>
        <p class="gameover-reason" id="gameover-reason"></p>
        <button class="menu-btn" onclick="location.reload()">重新開始</button>
    </div>
</div>

<div id="victory-screen" class="screen">
    <div class="gameover-box">
        <h1 class="victory-title">🎉 恭喜過關！</h1>
        <p style="font-size: 18px; margin-bottom: 25px;">你成功在森林中生存下來！</p>
        <p style="font-size: 16px; color: #aaa;" id="final-stats"></p>
        <button class="menu-btn" onclick="location.reload()">再玩一次</button>
    </div>
</div>

<script>
const questions = {
    cabin: [
        { q: "（ㄎㄜˋ）家文化園區", a: "客" }, { q: "（ㄊㄧˇ）驗活動", a: "體" }, { q: "最有（ㄑㄩˋ）", a: "趣" },
        { q: "（ㄖㄜˋ）呼呼的開水", a: "熱" }, { q: "（ㄔㄨㄥ）泡擂茶", a: "沖" }, { q: "老師教我唱好幾（ㄕㄡˇ）歌", a: "首" },
        { q: "慶祝聖誕（ㄐㄧㄝˊ）", a: "節" }, { q: "他在學校跌（ㄉㄠˇ）了", a: "倒" }, { q: "護理師（ㄍㄢˇ）緊通知家人", a: "趕" },
        { q: "大家（ㄑㄧㄤˇ）著吃蝦仁蒸蛋", a: "搶" }, { q: "（ㄒㄧㄚ）仁蒸蛋", a: "蝦" }, { q: "新聞主（ㄅㄛˋ）", a: "播" },
        { q: "（ㄅㄠˋ）導警察抓到小偷", a: "報" }, { q: "（ㄔㄨㄤˇ）空門的小偷", a: "闖" }, { q: "精采的鼓（ㄓㄤˇ）", a: "掌" },
        { q: "（ㄅㄛˊ）子上戴項鍊", a: "脖" }, { q: "一條（ㄒㄧㄤˋ）鍊", a: "項" }, { q: "猜燈（ㄇㄧˊ）活動", a: "謎" },
        { q: "非常（ㄖㄜˋ）鬧", a: "熱" }, { q: "（ㄖㄣˋ）識新朋友", a: "認" }
    ],
    swamp: [
        { q: "媽媽買了很多新鮮的食才。", a: "材" }, { q: "妹妹喜歡吃脆脆的海台。", a: "苔" },
        { q: "大家一口同聲回答正確答案。", a: "異" }, { q: "弟弟不小心打番了牛奶。", a: "翻" }, { q: "哥哥岡才扭到腳了。", a: "剛" }
    ],
    temple: [
        { word: "變", stages: [{ q: "請問「變」有幾畫？", a: "23", hint: "數一數筆畫" }, { q: "請問「變」的部首？", a: "言", hint: "寫出部首" }, { q: "請用「變」造詞", a: "變成", hint: "" }]},
        { word: "剛", stages: [{ q: "請問「剛」有幾畫？", a: "10", hint: "數一數筆畫" }, { q: "請問「剛」的部首？", a: "刀", hint: "寫出部首" }, { q: "請用「剛」造詞", a: "剛才", hint: "" }]},
        { word: "緊", stages: [{ q: "請問「緊」有幾畫？", a: "15", hint: "數一數筆畫" }, { q: "請問「緊」的部首？", a: "糸", hint: "寫出部首" }, { q: "請用「緊」造詞", a: "緊張", hint: "" }]},
        { word: "享", stages: [{ q: "請問「享」有幾畫？", a: "8", hint: "數一數筆畫" }, { q: "請問「享」的部首？", a: "亠", hint: "寫出部首" }, { q: "請用「享」造詞", a: "分享", hint: "" }]},
        { word: "平", stages: [{ q: "請問「平」有幾畫？", a: "5", hint: "數一數筆畫" }, { q: "請問「平」的部首？", a: "干", hint: "寫出部首" }, { q: "請用「平」造詞", a: "平安", hint: "" }]}
    ],
    sound: [
        { q: "「種」：爸爸在田裡（  ）下百合花的（  ）子。", options: ["ㄓㄨㄥˋ、ㄓㄨㄥˇ", "ㄓㄨㄥˇ、ㄓㄨㄥˋ", "ㄓㄨㄥˋ、ㄓㄨㄥˋ", "ㄓㄨㄥˇ、ㄓㄨㄥˇ"], a: "ㄓㄨㄥˋ、ㄓㄨㄥˇ" },
        { q: "「好」：妹妹（  ）奇的想知道誰是她的（  ）朋友。", options: ["ㄏㄠˋ、ㄏㄠˇ", "ㄏㄠˇ、ㄏㄠˋ", "ㄏㄠˋ、ㄏㄠˋ", "ㄏㄠˇ、ㄏㄠˇ"], a: "ㄏㄠˋ、ㄏㄠˇ" },
        { q: "「長」：小草（  ）高了，葉子變得很（  ）。", options: ["ㄓㄤˇ、ㄔㄤˊ", "ㄔㄤˊ、ㄓㄤˇ", "ㄓㄤˇ、ㄓㄤˇ", "ㄔㄤˊ、ㄔㄤˊ"], a: "ㄓㄤˇ、ㄔㄤˊ" },
        { q: "「數」：他（  ）了一下書本的（  ）量。", options: ["ㄕㄨˇ、ㄕㄨˋ", "ㄕㄨˋ、ㄕㄨˇ", "ㄕㄨˇ、ㄕㄨˇ", "ㄕㄨˋ、ㄕㄨˋ"], a: "ㄕㄨˇ、ㄕㄨˋ" },
        { q: "「更」：（  ）換衣服後，看起來（  ）加清爽。", options: ["ㄍㄥ、ㄍㄥˋ", "ㄍㄥˋ、ㄍㄥ", "ㄍㄥ、ㄍㄥ", "ㄍㄥˋ、ㄍㄥˋ"], a: "ㄍㄥ、ㄍㄥˋ" }
    ],
    sentence: [
        { example: "太陽一出來，立刻暖洋洋。", template: "（①）一（②），立刻（③）。", blanks: 3, answers: ["月亮", "進去", "閒得發慌"] },
        { example: "濃濃的香味", template: "（①）的（②）", blanks: 2, answers: ["淡淡", "香氣"] },
        { example: "有了陽光，花朵更美麗了。", template: "有了（①），（②）更（③）了。", blanks: 3, answers: ["故事", "春捲", "美味"] }
    ],
    maze: {
        passage: "很久以前，有一隻小青蛙住在一口古井裡。有一天，牠遇到一隻大烏龜。大烏龜告訴小青蛙：「我的家在大海，海比古井大得多，游來游去看不到邊界。」小青蛙聽呆了，才知道自己的世界是多麼的小。",
        questions: [
            { q: "青蛙住在哪裡？", options: ["大海", "井底", "水草下"], a: "井底" },
            { q: "適合當這篇故事的題目？", options: ["井底之龜", "海底之蛙", "井底之蛙"], a: "井底之蛙" },
            { q: "故事告訴我們什麼道理？", options: ["要多交朋友", "要多認識外面的世界", "大烏龜不愛玩"], a: "要多認識外面的世界" }
        ]
    }
};

const mapNames = { cabin: "字林小屋", swamp: "錯字沼澤", temple: "部首神殿", sound: "讀音森林", sentence: "造句山谷", maze: "閱讀迷宮" };
const mapBackgrounds = { cabin: "images/cabin.jpg", swamp: "images/swamp.jpg", temple: "images/temple.jpg", sound: "images/menu.jpg", sentence: "images/menu.jpg", maze: "images/maze.jpg" };

const monsterSchedule = {
    3: { type: 'wolf', title: '🌙 夜晚即將來臨！', monster: '🐺 Wolf 正在接近...', requirements: [{ items: '🔥 火把 ×1', desc: '嚇走 Wolf', cost: '4💎' }, { items: '🗡️ 苦無 ×1', desc: '打倒 Wolf，可得低等毛皮', cost: '8💎' }], prepare: '🔥火把(4💎) 或 🗡️苦無(8💎)' },
    5: { type: 'alphaWolf', title: '⚠️ 危險警報！', monster: '🐺👑 Alpha Wolf 正在逼近！', requirements: [{ items: '🗡️ 苦無 ×2', desc: '打倒 Alpha Wolf，可得毛皮', cost: '16💎' }], prepare: '🗡️苦無×2(16💎)' },
    6: { type: 'polarBear', title: '🚨 Boss 戰！', monster: '🐻‍❄️ 北極熊 出現了！', requirements: [{ items: '🗡️苦無×2 + 🧥毛皮 + 🦶兔子腳', desc: '打倒北極熊，可得傳說之劍', cost: '毛皮需打倒 Alpha Wolf' }], prepare: '🗡️苦無×2 + 🧥毛皮 + 🦶兔子腳(4💎)' }
};

const monsters = {
    wolf: { name: "Wolf 🐺", icon: "🐺", desc: "一隻灰狼出現了！", actions: [{ text: "🔥 火把嚇走", requires: { torch: 1 }, consumes: { torch: 1 } }, { text: "🗡️ 苦無打倒", requires: { kunai: 1 }, consumes: { kunai: 1 }, drops: { lowFur: 1 } }] },
    alphaWolf: { name: "Alpha Wolf 🐺👑", icon: "🐺", desc: "狼王出現了！", actions: [{ text: "🗡️ 苦無×2 打倒", requires: { kunai: 2 }, consumes: { kunai: 2 }, drops: { fur: 1 } }] },
    polarBear: { name: "北極熊 🐻‍❄️", icon: "🐻‍❄️", desc: "巨大的北極熊！", actions: [{ text: "🗡️🧥🦶 全力攻擊", requires: { kunai: 2, fur: 1, rabbitFoot: 1 }, consumes: { kunai: 2, fur: 1, rabbitFoot: 1 }, drops: { sword: 1 } }] }
};

let gameState = { gems: 0, food: 2, inventory: { torch: 0, rabbitFoot: 0, kunai: 0, lowFur: 0, fur: 0, sword: 0 }, completedMaps: [], currentMap: null, currentQuestionIndex: 0, currentStageIndex: 0, templeStageCorrect: 0, retryUsed: false, mapsCleared: 0, pendingMonster: null, fromWarningShop: false };
let canvasContexts = [];

function shuffleArray(arr) { const a = [...arr]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }

function showScreen(id) { document.querySelectorAll('.screen').forEach(s => s.classList.remove('active')); document.getElementById(id).classList.add('active'); updateDisplays(); }

function updateDisplays() {
    ['gems-display', 'gems-display2', 'gems-display3'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = gameState.gems; });
    ['food-display', 'food-display2', 'food-display3'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = gameState.food; });
    updateInventoryDisplay(); updateMapButtons(); updateMonsterCountdown();
}

function updateInventoryDisplay() {
    const items = [], inv = gameState.inventory;
    if (inv.torch > 0) items.push(`🔥×${inv.torch}`);
    if (inv.rabbitFoot > 0) items.push(`🦶×${inv.rabbitFoot}`);
    if (inv.kunai > 0) items.push(`🗡️×${inv.kunai}`);
    if (inv.lowFur > 0) items.push(`🧶×${inv.lowFur}`);
    if (inv.fur > 0) items.push(`🧥×${inv.fur}`);
    if (inv.sword > 0) items.push(`⚔️×${inv.sword}`);
    const html = items.length > 0 ? items.map(i => `<span class="inv-item">${i}</span>`).join('') : '<span class="inv-item">（空）</span>';
    document.getElementById('inventory-display').innerHTML = html;
    const inv2 = document.getElementById('inventory-display2'); if (inv2) inv2.innerHTML = html;
}

function updateMapButtons() {
    ['cabin', 'swamp', 'temple', 'sound', 'sentence', 'maze'].forEach(map => {
        const btn = document.getElementById(`map-${map}`);
        if (btn && gameState.completedMaps.includes(map)) { btn.classList.add('completed'); if (!btn.textContent.includes('✅')) btn.textContent += ' ✅'; }
    });
}

function updateMonsterCountdown() {
    const container = document.getElementById('monster-countdown-container'); if (!container) return;
    let next = null, until = 0;
    for (const [t, d] of Object.entries(monsterSchedule)) { if (gameState.mapsCleared < parseInt(t)) { next = d; until = parseInt(t) - gameState.mapsCleared; break; } }
    if (next && until <= 3) { container.innerHTML = `<div class="monster-countdown"><div class="monster-countdown-title">⚠️ 怪物警報</div><div class="monster-countdown-info">${next.monster.split('正在')[0]} 將在 <strong>${until}</strong> 關後出現！</div><div class="monster-countdown-prepare">📦 準備：${next.prepare}</div></div>`; }
    else { container.innerHTML = ''; }
}
function startGame() {
    gameState = { gems: 0, food: 2, inventory: { torch: 0, rabbitFoot: 0, kunai: 0, lowFur: 0, fur: 0, sword: 0 }, completedMaps: [], currentMap: null, currentQuestionIndex: 0, currentStageIndex: 0, templeStageCorrect: 0, retryUsed: false, mapsCleared: 0, pendingMonster: null, fromWarningShop: false };
    showScreen('map-screen');
}

function enterMap(mapId) {
    if (gameState.completedMaps.includes(mapId)) { alert('這個地圖已經完成了！'); return; }
    gameState.currentMap = mapId; gameState.currentQuestionIndex = 0; gameState.currentStageIndex = 0; gameState.templeStageCorrect = 0; gameState.retryUsed = false;
    document.getElementById('question-screen').style.backgroundImage = `url('${mapBackgrounds[mapId]}')`; showScreen('question-screen'); showQuestion();
}

function initSingleCanvas(canvasId) {
    const canvas = document.getElementById(canvasId); if (!canvas) return null;
    const ctx = canvas.getContext('2d'); ctx.strokeStyle = '#000'; ctx.lineWidth = 5; ctx.lineCap = 'round';
    let drawing = false, lastX = 0, lastY = 0;
    canvas.onmousedown = e => { drawing = true; lastX = e.offsetX; lastY = e.offsetY; };
    canvas.onmousemove = e => { if (!drawing) return; ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(e.offsetX, e.offsetY); ctx.stroke(); lastX = e.offsetX; lastY = e.offsetY; };
    canvas.onmouseup = canvas.onmouseout = () => drawing = false;
    canvas.ontouchstart = e => { e.preventDefault(); const t = e.touches[0], r = canvas.getBoundingClientRect(); drawing = true; lastX = t.clientX - r.left; lastY = t.clientY - r.top; };
    canvas.ontouchmove = e => { e.preventDefault(); if (!drawing) return; const t = e.touches[0], r = canvas.getBoundingClientRect(); ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(t.clientX - r.left, t.clientY - r.top); ctx.stroke(); lastX = t.clientX - r.left; lastY = t.clientY - r.top; };
    canvas.ontouchend = () => drawing = false;
    return ctx;
}
function clearAllCanvases() { canvasContexts.forEach(ctx => { if (ctx) ctx.clearRect(0, 0, ctx.canvas.width, ctx.canvas.height); }); }
function clearSingleCanvas(id) { const c = document.getElementById(id); if (c) c.getContext('2d').clearRect(0, 0, c.width, c.height); }

function showQuestion() {
    const mapId = gameState.currentMap;
    document.getElementById('reading-passage-container').innerHTML = ''; document.getElementById('example-container').innerHTML = '';
    document.getElementById('question-hint').textContent = ''; document.getElementById('stage-display').innerHTML = '';
    document.getElementById('feedback').textContent = ''; document.getElementById('feedback').className = 'feedback'; canvasContexts = [];
    if (mapId === 'temple') { showTempleQuestion(); return; }
    if (mapId === 'sentence') { showSentenceQuestion(); return; }
    let qData, total;
    if (mapId === 'maze') { qData = questions.maze.questions[gameState.currentQuestionIndex]; total = questions.maze.questions.length; document.getElementById('reading-passage-container').innerHTML = `<div class="reading-passage">${questions.maze.passage}</div>`; }
    else { qData = questions[mapId][gameState.currentQuestionIndex]; total = questions[mapId].length; }
    document.getElementById('progress-display').textContent = `${mapNames[mapId]} - 第 ${gameState.currentQuestionIndex + 1} 題，共 ${total} 題`;
    document.getElementById('question-text').textContent = qData.q;
    if (qData.hint) document.getElementById('question-hint').textContent = qData.hint;
    const area = document.getElementById('answer-area');
    if (['cabin', 'swamp'].includes(mapId)) {
        let extra = mapId === 'swamp' ? '<p style="margin-bottom:10px;color:#ffaa00;">請找出句子中的錯字，並寫出正確的字</p>' : '';
        area.innerHTML = `${extra}<div class="canvas-container"><canvas id="main-canvas" class="writing-canvas" width="250" height="180"></canvas></div><div class="canvas-buttons"><button class="canvas-btn clear-btn" onclick="clearSingleCanvas('main-canvas')">清除</button><button class="canvas-btn done-btn" onclick="showAnswer()">我寫好了</button></div><div id="answer-reveal" style="display:none;"></div>`;
        setTimeout(() => { canvasContexts.push(initSingleCanvas('main-canvas')); }, 100);
    } else {
        const opts = shuffleArray(qData.options).map(o => `<button class="option-btn" onclick="selectOption('${o}')">${o}</button>`).join('');
        area.innerHTML = `<div class="answer-options">${opts}</div>`;
    }
}

function showTempleQuestion() {
    const qData = questions.temple[gameState.currentQuestionIndex], sData = qData.stages[gameState.currentStageIndex];
    document.getElementById('progress-display').textContent = `${mapNames.temple} - 第 ${gameState.currentQuestionIndex + 1} 題，共 ${questions.temple.length} 題`;
    document.getElementById('stage-display').innerHTML = `<span class="stage-indicator">📝 階段 ${gameState.currentStageIndex + 1}/3</span>`;
    document.getElementById('question-text').textContent = sData.q;
    if (sData.hint) document.getElementById('question-hint').textContent = sData.hint;
    document.getElementById('answer-area').innerHTML = `<div class="canvas-container"><canvas id="main-canvas" class="writing-canvas" width="250" height="130"></canvas></div><div class="canvas-buttons"><button class="canvas-btn clear-btn" onclick="clearSingleCanvas('main-canvas')">清除</button><button class="canvas-btn done-btn" onclick="showTempleAnswer()">我寫好了</button></div><div id="answer-reveal" style="display:none;"></div>`;
    setTimeout(() => { canvasContexts = [initSingleCanvas('main-canvas')]; }, 100);
}

function showTempleAnswer() {
    const sData = questions.temple[gameState.currentQuestionIndex].stages[gameState.currentStageIndex];
    document.getElementById('answer-reveal').style.display = 'block';
    document.getElementById('answer-reveal').innerHTML = `<div class="answer-reveal"><p>正確答案：</p><div class="correct-answer">${sData.a}</div><p>你寫對了嗎？</p><div class="confirm-buttons"><button class="confirm-btn correct-btn" onclick="confirmTempleAnswer(true)">✅ 對</button><button class="confirm-btn wrong-btn" onclick="confirmTempleAnswer(false)">❌ 錯</button></div></div>`;
}

function confirmTempleAnswer(correct) {
    const fb = document.getElementById('feedback');
    if (correct) { gameState.templeStageCorrect++; fb.textContent = '✅ 正確！'; fb.className = 'feedback correct'; }
    else { fb.textContent = '❌ 錯誤'; fb.className = 'feedback wrong'; }
    gameState.currentStageIndex++;
    if (gameState.currentStageIndex < 3) { setTimeout(showTempleQuestion, 800); }
    else {
        const gems = Math.floor(gameState.templeStageCorrect * 4 / 3);
        if (gems > 0) { gameState.gems += gems; fb.textContent = `🎉 本題完成！+${gems} 💎`; fb.className = 'feedback correct'; }
        else { fb.textContent = '😢 本題沒有得分'; fb.className = 'feedback wrong'; }
        updateDisplays(); gameState.currentStageIndex = 0; gameState.templeStageCorrect = 0; gameState.currentQuestionIndex++;
        setTimeout(() => { if (gameState.currentQuestionIndex >= questions.temple.length) completeMap(); else showTempleQuestion(); }, 1200);
    }
}

function showSentenceQuestion() {
    const qData = questions.sentence[gameState.currentQuestionIndex];
    document.getElementById('progress-display').textContent = `${mapNames.sentence} - 第 ${gameState.currentQuestionIndex + 1} 題，共 ${questions.sentence.length} 題`;
    document.getElementById('example-container').innerHTML = `<div class="example-box"><div class="example-label">📖 例句：</div><div class="example-text">${qData.example}</div></div>`;
    document.getElementById('question-text').innerHTML = `<div class="template-text">${qData.template}</div>`;
    let html = '<div class="multi-canvas-container">';
    for (let i = 0; i < qData.blanks; i++) html += `<div class="single-blank"><div class="blank-label">第 ${i+1} 格</div><div class="blank-canvas-wrap"><canvas id="blank-canvas-${i}" class="blank-canvas" width="120" height="100"></canvas></div></div>`;
    html += '</div>';
    document.getElementById('answer-area').innerHTML = `${html}<div class="canvas-buttons"><button class="canvas-btn clear-btn" onclick="clearAllCanvases()">清除全部</button><button class="canvas-btn done-btn" onclick="showSentenceAnswer()">我寫好了</button></div><div id="answer-reveal" style="display:none;"></div>`;
    setTimeout(() => { canvasContexts = []; for (let i = 0; i < qData.blanks; i++) canvasContexts.push(initSingleCanvas(`blank-canvas-${i}`)); }, 100);
}

function showSentenceAnswer() {
    const qData = questions.sentence[gameState.currentQuestionIndex];
    let html = '<div class="answers-list">'; qData.answers.forEach((a, i) => html += `<span class="answer-item">第${i+1}格：${a}</span>`); html += '</div>';
    document.getElementById('answer-reveal').style.display = 'block';
    document.getElementById('answer-reveal').innerHTML = `<div class="answer-reveal"><p>正確答案：</p>${html}<p style="margin-top:15px;">你寫對了嗎？</p><div class="confirm-buttons"><button class="confirm-btn correct-btn" onclick="confirmAnswer(true,2)">✅ 對 +2💎</button><button class="confirm-btn wrong-btn" onclick="confirmAnswer(false,2)">❌ 錯</button></div></div>`;
}

function showAnswer() {
    const qData = questions[gameState.currentMap][gameState.currentQuestionIndex];
    document.getElementById('answer-reveal').style.display = 'block';
    document.getElementById('answer-reveal').innerHTML = `<div class="answer-reveal"><p>正確答案：</p><div class="correct-answer">${qData.a}</div><p>你寫對了嗎？</p><div class="confirm-buttons"><button class="confirm-btn correct-btn" onclick="confirmAnswer(true,2)">✅ 對 +2💎</button><button class="confirm-btn wrong-btn" onclick="confirmAnswer(false,2)">❌ 錯</button></div></div>`;
}

function confirmAnswer(correct, gems) {
    const fb = document.getElementById('feedback');
    if (correct) { fb.textContent = `✅ 正確！+${gems} 💎`; fb.className = 'feedback correct'; gameState.gems += gems; gameState.retryUsed = false; setTimeout(nextQuestion, 800); }
    else { if (!gameState.retryUsed) { fb.textContent = '❌ 再試一次！'; fb.className = 'feedback wrong'; gameState.retryUsed = true; clearAllCanvases(); document.getElementById('answer-reveal').style.display = 'none'; } else { fb.textContent = '❌ 沒關係，繼續加油！'; fb.className = 'feedback wrong'; gameState.retryUsed = false; setTimeout(nextQuestion, 1000); } }
    updateDisplays();
}

function selectOption(opt) {
    const mapId = gameState.currentMap, ans = mapId === 'maze' ? questions.maze.questions[gameState.currentQuestionIndex].a : questions[mapId][gameState.currentQuestionIndex].a;
    const fb = document.getElementById('feedback');
    if (opt === ans) { fb.textContent = '✅ 正確！+2 💎'; fb.className = 'feedback correct'; gameState.gems += 2; gameState.retryUsed = false; setTimeout(nextQuestion, 1000); }
    else { if (!gameState.retryUsed) { fb.textContent = '❌ 錯誤！再試一次'; fb.className = 'feedback wrong'; gameState.retryUsed = true; } else { fb.textContent = `❌ 答案是：${ans}`; fb.className = 'feedback wrong'; gameState.retryUsed = false; setTimeout(nextQuestion, 1500); } }
    updateDisplays();
}

function nextQuestion() {
    const mapId = gameState.currentMap, total = mapId === 'maze' ? questions.maze.questions.length : questions[mapId].length;
    gameState.currentQuestionIndex++;
    if (gameState.currentQuestionIndex >= total) completeMap(); else showQuestion();
}

function completeMap() {
    gameState.completedMaps.push(gameState.currentMap); gameState.mapsCleared++; gameState.food--;
    if (gameState.food < 0) { gameOver('你餓死了！記得購買食物。'); return; }
    const schedule = monsterSchedule[gameState.mapsCleared];
    if (schedule) { alert(`🎉 ${mapNames[gameState.currentMap]}完成！\n🍙 剩餘食物：${gameState.food}\n⚠️ 怪物即將出現！`); gameState.pendingMonster = schedule.type; showWarning(schedule.title, schedule.monster, schedule.requirements); }
    else if (gameState.completedMaps.length >= 6) { victory(); }
    else { alert(`🎉 ${mapNames[gameState.currentMap]}完成！\n🍙 剩餘食物：${gameState.food}`); showScreen('map-screen'); }
}

function showWarning(title, monster, reqs) {
    document.getElementById('warning-title').textContent = title; document.getElementById('warning-monster').textContent = monster;
    let html = '<div class="warning-requirements-title">📦 需要準備的道具</div>';
    reqs.forEach((r, i) => { if (i > 0) html += '<div class="warning-or">── 或 ──</div>'; html += `<div class="warning-requirement-item"><div class="warning-requirement-items">${r.items}</div><div class="warning-requirement-desc">→ ${r.desc}</div><div class="warning-requirement-cost">💰 ${r.cost}</div></div>`; });
    const inv = gameState.inventory, items = [];
    if (inv.torch > 0) items.push(`🔥×${inv.torch}`); if (inv.rabbitFoot > 0) items.push(`🦶×${inv.rabbitFoot}`); if (inv.kunai > 0) items.push(`🗡️×${inv.kunai}`); if (inv.lowFur > 0) items.push(`🧶×${inv.lowFur}`); if (inv.fur > 0) items.push(`🧥×${inv.fur}`);
    html += `<div class="warning-inventory"><div class="warning-inventory-title">🎒 你的背包：</div><div>${items.length ? items.join(' ') : '（空）'}</div><div style="margin-top:5px;font-size:13px;">💎 寶石：${gameState.gems}</div></div>`;
    document.getElementById('warning-requirements').innerHTML = html; showScreen('warning-screen');
}

function goToShopFromWarning() { gameState.fromWarningShop = true; document.getElementById('shop-back-btn').textContent = '✅ 準備好了'; showScreen('shop-screen'); }
function proceedToMonster() { triggerMonster(gameState.pendingMonster); }
function openShop() { gameState.fromWarningShop = false; document.getElementById('shop-back-btn').textContent = '返回地圖'; showScreen('shop-screen'); }
function closeShop() { if (gameState.fromWarningShop) { gameState.fromWarningShop = false; triggerMonster(gameState.pendingMonster); } else { showScreen('map-screen'); } }

function buyItem(item) {
    const prices = { food: 3, torch: 4, rabbitFoot: 4, kunai: 8 };
    if (gameState.gems < prices[item]) { alert('寶石不足！'); return; }
    gameState.gems -= prices[item];
    if (item === 'food') gameState.food++; else gameState.inventory[item]++;
    updateDisplays();
}

function craftFur() {
    if (gameState.inventory.lowFur >= 2) { gameState.inventory.lowFur -= 2; gameState.inventory.fur++; alert('合成成功！獲得毛皮 ×1'); updateDisplays(); }
    else { alert('需要低等毛皮 ×2！'); }
}

function triggerMonster(type) {
    const m = monsters[type];
    document.getElementById('monster-icon').textContent = m.icon; document.getElementById('monster-name').textContent = m.name; document.getElementById('monster-desc').textContent = m.desc;
    let html = m.actions.map((a, i) => { const can = Object.entries(a.requires).every(([k, v]) => (gameState.inventory[k] || 0) >= v); return `<button class="monster-btn" ${can ? '' : 'disabled'} onclick="useMonsterAction('${type}',${i})">${a.text}</button>`; }).join('');
    html += `<button class="monster-btn" style="background:#333;" onclick="fleeMonster()">🏃 逃跑（損失一半寶石）</button>`;
    document.getElementById('monster-actions').innerHTML = html; showScreen('monster-screen');
}

function useMonsterAction(type, idx) {
    const a = monsters[type].actions[idx];
    for (let k in a.consumes) gameState.inventory[k] -= a.consumes[k];
    if (a.drops) { for (let k in a.drops) gameState.inventory[k] = (gameState.inventory[k] || 0) + a.drops[k]; const names = { lowFur: '低等毛皮', fur: '毛皮', sword: '傳說之劍' }; alert(`🎉 成功！獲得：${Object.entries(a.drops).map(([k, v]) => `${names[k]}×${v}`).join(', ')}`); }
    else { alert('🎉 成功擊退怪物！'); }
    if (gameState.completedMaps.length >= 6) victory(); else showScreen('map-screen');
}

function fleeMonster() { gameState.gems = Math.floor(gameState.gems / 2); alert(`逃跑了！損失一半寶石，剩餘：${gameState.gems}`); showScreen('map-screen'); }
function gameOver(reason) { document.getElementById('gameover-reason').textContent = reason; showScreen('gameover-screen'); }
function victory() { document.getElementById('final-stats').innerHTML = `最終寶石：${gameState.gems} 💎<br>傳說之劍：${gameState.inventory.sword} ⚔️`; showScreen('victory-screen'); }
</script>
